[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ztad-toolkit"
version = "4.2.0"
description = "Adaptive multi-model controls for ZTAD Mesh autonomous delivery"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.3,<7",
  "jsonschema>=4.26.0,<5",
  "cryptography>=50.0.0,<51",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "coverage==7.15.4", "pytest-cov==7.1.0", "hypothesis==6.165.2"]

[project.scripts]
ztad = "ztad.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
