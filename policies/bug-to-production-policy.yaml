version: 1
protocol: WorkshopOS-Fail-Closed-Bug-to-Production-v1
mode: FAIL_CLOSED
states:
- UNVERIFIED_REPORT
- SOURCE_OF_TRUTH_RESOLVED
- ISSUE_CLASSIFIED
- BUG_REPRODUCED
- ROOT_CAUSE_PROVEN
- BLAST_RADIUS_MAPPED
- CHANGE_PLANNED
- PATCH_IMPLEMENTED
- REGRESSION_TEST_PROVEN
- TARGETED_VALIDATION_PASS
- REGRESSION_VALIDATION_PASS
- DIFF_FORENSICS_PASS
- INDEPENDENT_REVIEW_PASS
- CI_PASS
- STAGING_PASS
- READY_FOR_OWNER_RELEASE
- PRODUCTION_RELEASED
- POST_DEPLOY_VERIFIED
- CLOSED
- BLOCKED
- ROLLBACK_REQUIRED
- RESOLVED_NO_CODE
transitions:
  UNVERIFIED_REPORT:
  - SOURCE_OF_TRUTH_RESOLVED
  - BLOCKED
  SOURCE_OF_TRUTH_RESOLVED:
  - ISSUE_CLASSIFIED
  - BLOCKED
  ISSUE_CLASSIFIED:
  - BUG_REPRODUCED
  - RESOLVED_NO_CODE
  - BLOCKED
  BUG_REPRODUCED:
  - ROOT_CAUSE_PROVEN
  - BLOCKED
  ROOT_CAUSE_PROVEN:
  - BLAST_RADIUS_MAPPED
  - BLOCKED
  BLAST_RADIUS_MAPPED:
  - CHANGE_PLANNED
  - BLOCKED
  CHANGE_PLANNED:
  - PATCH_IMPLEMENTED
  - BLOCKED
  PATCH_IMPLEMENTED:
  - REGRESSION_TEST_PROVEN
  - BLOCKED
  REGRESSION_TEST_PROVEN:
  - TARGETED_VALIDATION_PASS
  - BLOCKED
  TARGETED_VALIDATION_PASS:
  - REGRESSION_VALIDATION_PASS
  - BLOCKED
  REGRESSION_VALIDATION_PASS:
  - DIFF_FORENSICS_PASS
  - BLOCKED
  DIFF_FORENSICS_PASS:
  - INDEPENDENT_REVIEW_PASS
  - BLOCKED
  INDEPENDENT_REVIEW_PASS:
  - CI_PASS
  - BLOCKED
  CI_PASS:
  - STAGING_PASS
  - BLOCKED
  STAGING_PASS:
  - READY_FOR_OWNER_RELEASE
  - BLOCKED
  READY_FOR_OWNER_RELEASE:
  - PRODUCTION_RELEASED
  - BLOCKED
  PRODUCTION_RELEASED:
  - POST_DEPLOY_VERIFIED
  - ROLLBACK_REQUIRED
  POST_DEPLOY_VERIFIED:
  - CLOSED
  - ROLLBACK_REQUIRED
  CLOSED: []
  BLOCKED: []
  ROLLBACK_REQUIRED:
  - CHANGE_PLANNED
  - CLOSED
  RESOLVED_NO_CODE: []
profiles:
  workshopos:
    canonical_deployment_chain:
    - DEPLOYMENT.md
    - infra/docs/runbook.md
    - .github/workflows/deploy.yml
gates:
  PATCH_IMPLEMENTED:
    minimum_trust: E2
    required_evidence:
    - CANDIDATE_PATCH_CREATED
  REGRESSION_TEST_PROVEN:
    minimum_trust: E2
    required_evidence:
    - REGRESSION_RED_GREEN_PROVEN
  TARGETED_VALIDATION_PASS:
    minimum_trust: E2
    required_evidence:
    - TARGETED_VALIDATION_PASSED
    by_domain:
      DATABASE:
      - MIGRATION_LEDGER_HISTORY_GUARD_PASSED
      - FRESH_DB_REBUILD_PASSED
      - DATABASE_RECOVERY_PLAN_VERIFIED
      AUTH_TENANT:
      - AUTHZ_TENANT_MATRIX_PASSED
      FINANCIAL:
      - FINANCIAL_INVARIANTS_PASSED
      ZATCA:
      - ZATCA_INVARIANTS_PASSED
      PROVIDER:
      - PROVIDER_SEMANTICS_PASSED
      CONCURRENCY:
      - CONCURRENCY_INVARIANTS_PASSED
  REGRESSION_VALIDATION_PASS:
    minimum_trust: E2
    required_evidence:
    - FULL_REGRESSION_VALIDATION_PASSED
  DIFF_FORENSICS_PASS:
    minimum_trust: E2
    required_evidence:
    - DIFF_FORENSICS_PASSED
  INDEPENDENT_REVIEW_PASS:
    minimum_trust: E3
    required_evidence:
    - INDEPENDENT_REVIEW_COMPLETED
  CI_PASS:
    minimum_trust: E3
    required_evidence:
    - PROTECTED_CI
    - REQUIRED_CHECKS_VERIFIED
  STAGING_PASS:
    minimum_trust: E4
    required_evidence:
    - STAGING_SMOKE_PASSED
    - ORIGINAL_PROBLEM_STAGING_VERIFIED
  READY_FOR_OWNER_RELEASE:
    minimum_trust: E4
    required_evidence:
    - RELEASE_FINGERPRINT_VERIFIED
    - SIGNED_RELEASE_MANIFEST
    - SBOM_VERIFIED
    - ARTIFACT_ATTESTATION_VERIFIED
    - BUILD_PROVENANCE_VERIFIED
    - ROLLBACK_READY
    - ROLLBACK_REHEARSAL_VERIFIED
    - OBSERVABILITY_READY
    - SYNTHETIC_TRANSACTION_DEFINED
    by_risk:
      R3:
      - STAGED_RESTORE_REHEARSAL
      R4:
      - BACKUP_RESTORE_EVIDENCE
      - REHEARSAL_EVIDENCE
      - STAGED_RESTORE_REHEARSAL
  PRODUCTION_RELEASED:
    minimum_trust: E5
    required_evidence:
    - PROTECTED_RELEASE_AUTHORIZATION
    - PRODUCTION_RELEASE_COMPLETED
    - EXPECTED_DIGEST_RUNNING
  POST_DEPLOY_VERIFIED:
    minimum_trust: E5
    required_evidence:
    - ORIGINAL_PROBLEM_PRODUCTION_VERIFIED
    - PRODUCTION_HEALTH
    - SYNTHETIC_TRANSACTION
    - OBSERVATION_WINDOW
  CLOSED:
    minimum_trust: E5
    required_evidence: []
  ROLLBACK_REQUIRED:
    minimum_trust: E5
    required_evidence: []
  ROLLBACK_CLOSURE:
    minimum_trust: E5
    required_evidence:
    - ROLLBACK_COMPLETED
    - POST_ROLLBACK_HEALTH_VERIFIED
hotfix:
  may_reduce_validation_breadth: true
  may_skip_states: false
  critical_domains_keep_full_gates:
  - DATABASE
  - AUTH_TENANT
  - FINANCIAL
  - ZATCA
  - SECURITY
forbidden_claims:
- model_approval_is_authority
- deployment_command_success_means_fix_success
- internal_scheduler_done_means_bug_closed
- local_evidence_substitutes_for_protected_evidence
