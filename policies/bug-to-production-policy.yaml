version: 1
protocol: WorkshopOS-Fail-Closed-Bug-to-Production-v1
protocol_revision: 2
mode: FAIL_CLOSED
mandatory_fields:
- risk_classes
- deterministic_escalation
- domain_profiles.required_checks
- gates.by_risk
- progressive_exposure
- hotfix
- artifact_chain
- gates.READY_FOR_OWNER_RELEASE
- gates.ROLLBACK_CLOSURE
- profiles
authority_order:
- GOVERNING_INSTRUCTION
- EXECUTABLE_SOURCE
- AUTHORIZED_RUNTIME
- TEST_BEHAVIOR
- ARCHITECTURE_INTENT
- REPORT_OR_PLAN
unresolved_conflict_action: 'BLOCKED: SOURCE_CONFLICT'
pre_production_failure_action: BLOCKED
post_production_failure_action: ROLLBACK_REQUIRED
internal_state_boundary:
  scheduler_states_are_subordinate: true
  scheduler_terminal_state: INTERNAL_EXECUTION_COMPLETE
  legacy_done_is_never_bug_closure: true
risk_classes:
  LOW:
  - R0
  - R1
  MEDIUM:
  - R2
  HIGH:
  - R3
  CRITICAL:
  - R4
deterministic_escalation:
  HIGH:
  - auth
  - authorization
  - tenant_isolation
  - persistent_write
  - provider_side_effect
  - concurrency
  - infrastructure
  CRITICAL:
  - destructive_database
  - payment
  - ledger
  - financial_invoice
  - zatca
  - encryption
  - kms
  - secret
  - production_delivery
  - irreversible_side_effect
domain_profiles:
  DATABASE:
    minimum_risk_class: HIGH
    destructive_risk_class: CRITICAL
    required_checks:
    - MIGRATION_NECESSITY_PROVEN
    - MIGRATION_LEDGER_HISTORY_GUARD_PASSED
    - FRESH_DB_REBUILD_PASSED
    - DATABASE_RECOVERY_PLAN_VERIFIED
    - OLD_APP_NEW_SCHEMA_COMPATIBILITY
    - NEW_APP_OLD_SCHEMA_COMPATIBILITY
    - RLS_TENANT_DATA_SAFETY_PASSED
    - BOUNDED_MIGRATION_BACKFILL_PASSED
  AUTH_TENANT:
    minimum_risk_class: HIGH
    required_checks:
    - AUTHZ_TENANT_MATRIX_PASSED
    - SERVER_SIDE_AUTHORIZATION_PASSED
    - TENANT_CROSSING_DENIED
    - ID_TAMPERING_DENIED
    - PROTECTED_DATA_LEAKAGE_CHECK_PASSED
  FINANCIAL:
    minimum_risk_class: HIGH
    required_checks:
    - FINANCIAL_INVARIANTS_PASSED
    - IDEMPOTENCY_PASSED
    - CONCURRENCY_INVARIANTS_PASSED
    - LEDGER_CONSISTENCY_PASSED
    - NO_DUPLICATE_FINANCIAL_SIDE_EFFECT
    - ROUNDING_TAX_VAT_ZERO_VALUE_PASSED
    - FINAL_STATE_REFUND_SEMANTICS_PASSED
  ZATCA:
    minimum_risk_class: HIGH
    required_checks:
    - ZATCA_INVARIANTS_PASSED
    - ZATCA_LEGAL_STATE_MACHINE_PASSED
    - ZATCA_DUPLICATE_PREVENTION_PASSED
    - ZATCA_IMMUTABILITY_PASSED
    - ZATCA_SANDBOX_ONLY_TEST_PASSED
    - ZATCA_CLEARANCE_REPORTING_RETRY_CERTIFICATE_PASSED
    - ZATCA_SIGNED_DOCUMENT_CUTOVER_PASSED
  PROVIDER:
    minimum_risk_class: HIGH
    required_checks:
    - PROVIDER_SEMANTICS_PASSED
    - PROVIDER_STATE_RECONCILIATION_PASSED
    - PROVIDER_IDEMPOTENCY_PASSED
    - PROVIDER_SAFE_OUTAGE_PASSED
    - PROVIDER_CONTRACT_FAILURE_RECONCILIATION_PASSED
  CONCURRENCY:
    minimum_risk_class: HIGH
    required_checks:
    - CONCURRENCY_INVARIANTS_PASSED
    - PARALLEL_REPRODUCTION_PASSED
    - NO_DUPLICATE_DURABLE_SIDE_EFFECT
  SECURITY:
    minimum_risk_class: HIGH
    required_checks:
    - SECURITY_VALIDATION_PASSED
    - SECRETS_SCAN_PASSED
    - FAIL_CLOSED_BOUNDARY_PASSED
states:
- UNVERIFIED_REPORT
- SOURCE_OF_TRUTH_RESOLVED
- ISSUE_CLASSIFIED
- BUG_REPRODUCED
- ROOT_CAUSE_PROVEN
- BLAST_RADIUS_MAPPED
- CHANGE_PLANNED
- PATCH_IMPLEMENTED
- REGRESSION_TEST_PROVEN
- TARGETED_VALIDATION_PASS
- REGRESSION_VALIDATION_PASS
- DIFF_FORENSICS_PASS
- INDEPENDENT_REVIEW_PASS
- CI_PASS
- STAGING_PASS
- READY_FOR_OWNER_RELEASE
- PRODUCTION_RELEASED
- POST_DEPLOY_VERIFIED
- CLOSED
- BLOCKED
- ROLLBACK_REQUIRED
- RESOLVED_NO_CODE
transitions:
  UNVERIFIED_REPORT:
  - SOURCE_OF_TRUTH_RESOLVED
  - BLOCKED
  SOURCE_OF_TRUTH_RESOLVED:
  - ISSUE_CLASSIFIED
  - BLOCKED
  ISSUE_CLASSIFIED:
  - BUG_REPRODUCED
  - RESOLVED_NO_CODE
  - BLOCKED
  BUG_REPRODUCED:
  - ROOT_CAUSE_PROVEN
  - BLOCKED
  ROOT_CAUSE_PROVEN:
  - BLAST_RADIUS_MAPPED
  - BLOCKED
  BLAST_RADIUS_MAPPED:
  - CHANGE_PLANNED
  - BLOCKED
  CHANGE_PLANNED:
  - PATCH_IMPLEMENTED
  - BLOCKED
  PATCH_IMPLEMENTED:
  - REGRESSION_TEST_PROVEN
  - BLOCKED
  REGRESSION_TEST_PROVEN:
  - TARGETED_VALIDATION_PASS
  - BLOCKED
  TARGETED_VALIDATION_PASS:
  - REGRESSION_VALIDATION_PASS
  - BLOCKED
  REGRESSION_VALIDATION_PASS:
  - DIFF_FORENSICS_PASS
  - BLOCKED
  DIFF_FORENSICS_PASS:
  - INDEPENDENT_REVIEW_PASS
  - BLOCKED
  INDEPENDENT_REVIEW_PASS:
  - CI_PASS
  - BLOCKED
  CI_PASS:
  - STAGING_PASS
  - BLOCKED
  STAGING_PASS:
  - READY_FOR_OWNER_RELEASE
  - BLOCKED
  READY_FOR_OWNER_RELEASE:
  - PRODUCTION_RELEASED
  - BLOCKED
  PRODUCTION_RELEASED:
  - POST_DEPLOY_VERIFIED
  - ROLLBACK_REQUIRED
  POST_DEPLOY_VERIFIED:
  - CLOSED
  - ROLLBACK_REQUIRED
  CLOSED: []
  BLOCKED: []
  ROLLBACK_REQUIRED:
  - CHANGE_PLANNED
  - CLOSED
  RESOLVED_NO_CODE: []
profiles:
  workshopos:
    canonical_deployment_chain:
    - DEPLOYMENT.md
    - infra/docs/runbook.md
    - .github/workflows/deploy.yml
    deployment_source_hierarchy:
    - DEPLOYMENT.md
    - infra/docs/runbook.md
    - .github/workflows/deploy.yml
    domain_profiles:
    - FINANCIAL
    - AUTH_TENANT
    - ZATCA
    - DATABASE
    production_workflow: .github/workflows/deploy.yml
    test_only_message_destinations:
    - '0594269477'
    browser_e2e_requires_dummy_data: true
    protected_release_expectations:
    - protected_environment
    - exact_artifact_digest
    - migration_ledger
    - rollback_rehearsal
    forbidden_deployment_paths:
    - alternate SSH
    - ad-hoc VPS
    - direct production database
gates:
  PATCH_IMPLEMENTED:
    minimum_trust: E2
    required_evidence:
    - CANDIDATE_PATCH_CREATED
  REGRESSION_TEST_PROVEN:
    minimum_trust: E2
    required_evidence:
    - REGRESSION_RED_GREEN_PROVEN
    metadata_requirements:
    - bad_base_sha
    - candidate_head_sha
    - oracle_id
    - oracle_hash
    - oracle_command
    - bad_output_hash
    - candidate_output_hash
    - failing_assertion
    - passing_assertion
  TARGETED_VALIDATION_PASS:
    minimum_trust: E2
    required_evidence:
    - TARGETED_VALIDATION_PASSED
    by_domain:
      DATABASE:
      - MIGRATION_NECESSITY_PROVEN
      - MIGRATION_LEDGER_HISTORY_GUARD_PASSED
      - FRESH_DB_REBUILD_PASSED
      - DATABASE_RECOVERY_PLAN_VERIFIED
      - OLD_APP_NEW_SCHEMA_COMPATIBILITY
      - NEW_APP_OLD_SCHEMA_COMPATIBILITY
      - RLS_TENANT_DATA_SAFETY_PASSED
      - BOUNDED_MIGRATION_BACKFILL_PASSED
      AUTH_TENANT:
      - AUTHZ_TENANT_MATRIX_PASSED
      - SERVER_SIDE_AUTHORIZATION_PASSED
      - TENANT_CROSSING_DENIED
      - ID_TAMPERING_DENIED
      - PROTECTED_DATA_LEAKAGE_CHECK_PASSED
      FINANCIAL:
      - FINANCIAL_INVARIANTS_PASSED
      - IDEMPOTENCY_PASSED
      - CONCURRENCY_INVARIANTS_PASSED
      - LEDGER_CONSISTENCY_PASSED
      - NO_DUPLICATE_FINANCIAL_SIDE_EFFECT
      - ROUNDING_TAX_VAT_ZERO_VALUE_PASSED
      - FINAL_STATE_REFUND_SEMANTICS_PASSED
      ZATCA:
      - ZATCA_INVARIANTS_PASSED
      - ZATCA_LEGAL_STATE_MACHINE_PASSED
      - ZATCA_DUPLICATE_PREVENTION_PASSED
      - ZATCA_IMMUTABILITY_PASSED
      - ZATCA_SANDBOX_ONLY_TEST_PASSED
      - ZATCA_CLEARANCE_REPORTING_RETRY_CERTIFICATE_PASSED
      - ZATCA_SIGNED_DOCUMENT_CUTOVER_PASSED
      PROVIDER:
      - PROVIDER_SEMANTICS_PASSED
      - PROVIDER_STATE_RECONCILIATION_PASSED
      - PROVIDER_IDEMPOTENCY_PASSED
      - PROVIDER_SAFE_OUTAGE_PASSED
      - PROVIDER_CONTRACT_FAILURE_RECONCILIATION_PASSED
      CONCURRENCY:
      - CONCURRENCY_INVARIANTS_PASSED
      - PARALLEL_REPRODUCTION_PASSED
      - NO_DUPLICATE_DURABLE_SIDE_EFFECT
      SECURITY:
      - SECURITY_VALIDATION_PASSED
      - SECRETS_SCAN_PASSED
      - FAIL_CLOSED_BOUNDARY_PASSED
  REGRESSION_VALIDATION_PASS:
    minimum_trust: E2
    required_evidence:
    - FULL_REGRESSION_VALIDATION_PASSED
    metadata_requirements:
    - protected_base_sha
    - candidate_head_sha
    - test_layers
    - conclusion
  DIFF_FORENSICS_PASS:
    minimum_trust: E3
    required_evidence:
    - DIFF_FORENSICS_PASSED
  RESOLVED_NO_CODE:
    minimum_trust: E3
    required_evidence:
    - RESOLVED_NO_CODE_PROVEN
  INDEPENDENT_REVIEW_PASS:
    minimum_trust: E3
    required_evidence:
    - INDEPENDENT_REVIEW_COMPLETED
  CI_PASS:
    minimum_trust: E3
    required_evidence:
    - PROTECTED_CI
    - REQUIRED_CHECKS_VERIFIED
    metadata_requirements:
    - pr_head_sha
    - reviewed_diff_hash
    - required_checks
    - workflow_run_id
  STAGING_PASS:
    minimum_trust: E5
    required_evidence:
    - STAGING_SMOKE_PASSED
    - ORIGINAL_PROBLEM_STAGING_VERIFIED
    metadata_requirements:
    - candidate_head_sha
    - artifact_digest
    - original_symptom_absent
    - expected_behavior_present
    - health_verified
  READY_FOR_OWNER_RELEASE:
    minimum_trust: E4
    required_evidence:
    - RELEASE_FINGERPRINT_VERIFIED
    - SIGNED_RELEASE_MANIFEST
    - SBOM_VERIFIED
    - ARTIFACT_ATTESTATION_VERIFIED
    - BUILD_PROVENANCE_VERIFIED
    - ROLLBACK_READY
    - ROLLBACK_REHEARSAL_VERIFIED
    - OBSERVABILITY_READY
    - SYNTHETIC_TRANSACTION_DEFINED
    - PROTECTED_SUPERVISOR_APPROVAL
    by_risk:
      R3:
      - STAGED_RESTORE_REHEARSAL
      - PROGRESSIVE_EXPOSURE_PLAN
      R4:
      - BACKUP_RESTORE_EVIDENCE
      - REHEARSAL_EVIDENCE
      - STAGED_RESTORE_REHEARSAL
      - PROGRESSIVE_EXPOSURE_PLAN
    artifact_chain:
    - source_sha
    - release_fingerprint
    - artifact_digest
    - sbom_digest
    - provenance_digest
    - attestation_digest
    - artifact_identity
  PRODUCTION_RELEASED:
    minimum_trust: E5
    required_evidence:
    - PROTECTED_RELEASE_AUTHORIZATION
    - PRODUCTION_RELEASE_COMPLETED
    - EXPECTED_DIGEST_RUNNING
    metadata_requirements:
    - reviewed_main_sha
    - deployed_revision
    - artifact_digest
    - workflow_run_id
    - deployment_receipt
    - occurred_at
    - production_release_id
  POST_DEPLOY_VERIFIED:
    minimum_trust: E5
    required_evidence:
    - ORIGINAL_PROBLEM_PRODUCTION_VERIFIED
    - PRODUCTION_HEALTH
    - SYNTHETIC_TRANSACTION
    - OBSERVATION_WINDOW
    metadata_requirements:
    - deployed_artifact_digest
    - original_symptom_absent
    - expected_behavior_present
    - synthetic_transaction_safe
    - observation_window_complete
    - adjacent_health
  CLOSED:
    minimum_trust: E5
    required_evidence:
    - ORIGINAL_PROBLEM_PRODUCTION_VERIFIED
    - PRODUCTION_HEALTH
    - SYNTHETIC_TRANSACTION
    - OBSERVATION_WINDOW
  ROLLBACK_REQUIRED:
    minimum_trust: E5
    required_evidence: []
  ROLLBACK_CLOSURE:
    minimum_trust: E5
    required_evidence:
    - ROLLBACK_COMPLETED
    - POST_ROLLBACK_HEALTH_VERIFIED
    by_domain:
      DATABASE:
      - DATABASE_ROLLBACK_CONSISTENCY_VERIFIED
      AUTH_TENANT:
      - AUTHZ_ROLLBACK_MATRIX_PASSED
      FINANCIAL:
      - FINANCIAL_RECONCILIATION_PASSED
      ZATCA:
      - ZATCA_ROLLBACK_STATE_VERIFIED
      PROVIDER:
      - PROVIDER_RECONCILIATION_PASSED
      CONCURRENCY:
      - CONCURRENCY_SIDE_EFFECTS_RECONCILED
      SECURITY:
      - SECURITY_CONTAINMENT_VERIFIED
hotfix:
  may_reduce_validation_breadth: false
  may_skip_states: false
  critical_domains_keep_full_gates:
  - DATABASE
  - AUTH_TENANT
  - FINANCIAL
  - ZATCA
  - SECURITY
  minimum_lifecycle:
  - UNVERIFIED_REPORT
  - SOURCE_OF_TRUTH_RESOLVED
  - ISSUE_CLASSIFIED
  - BUG_REPRODUCED
  - ROOT_CAUSE_PROVEN
  - BLAST_RADIUS_MAPPED
  - CHANGE_PLANNED
  - PATCH_IMPLEMENTED
  - REGRESSION_TEST_PROVEN
  - TARGETED_VALIDATION_PASS
  - REGRESSION_VALIDATION_PASS
  - DIFF_FORENSICS_PASS
  - INDEPENDENT_REVIEW_PASS
  - CI_PASS
  - READY_FOR_OWNER_RELEASE
  - PRODUCTION_RELEASED
  - POST_DEPLOY_VERIFIED
  - CLOSED
continuation:
  local_remediable: AUTO_REPAIR
  invalid_plan: AUTO_REPLAN
  provider_or_model_failure: AUTO_REPAIR
  unsafe_task: QUARANTINE
  external_dependency: WAITING_EXTERNAL_DEPENDENCY
  identical_retry: AUTO_REPLAN
  continue_unrelated_safe_work: true
  retry_requires_material_change: true
progressive_exposure:
  HIGH:
    required_evidence:
    - PROGRESSIVE_EXPOSURE_PLAN
    strategies:
    - FEATURE_FLAG
    - CANARY
    - TENANT_LIMITED
    - BLUE_GREEN
    - READ_ONLY
    - ROLLBACK_TRIGGER
  CRITICAL:
    required_evidence:
    - PROGRESSIVE_EXPOSURE_PLAN
    strategies:
    - FEATURE_FLAG
    - CANARY
    - TENANT_LIMITED
    - BLUE_GREEN
    - WRITE_GATE
    - ROLLBACK_TRIGGER
    - OWNER_STOP_CONDITION
artifact_chain:
  immutable_subject_required: true
  source_to_release_to_artifact: true
  build_once_promote_by_digest: true
  mutable_tag_only: false
  rebuild_after_validation: false
forbidden_behaviors:
- ASSUME_BUG
- EDIT_BEFORE_CLASSIFICATION
- EDIT_BEFORE_REPRODUCTION
- EDIT_BEFORE_ROOT_CAUSE
- DIRECT_MAIN_MODIFICATION
- FORCE_PUSH_PROTECTED
- CI_BYPASS
- TEST_WEAKENING
- MOCKED_BOUNDARY_AS_PROOF
- PRODUCTION_DB_EXPERIMENT
- DIRECT_PRODUCTION_MIGRATION
- ALTERNATE_DEPLOY_PATH
- SECRETS_EXPOSURE
- PII_LOGGING
- TENANT_FILTER_REMOVAL
- UNPLANNED_AUTH_CHANGE
- UNPLANNED_FINANCIAL_CHANGE
- UNPLANNED_ZATCA_CHANGE
- DIFFERENT_COMMIT_DEPLOYED
- DEPLOYMENT_COMMAND_AS_FIX_PROOF
- UNEXPLAINED_DIFF
- SILENT_SCOPE_EXPANSION
- STALE_DOCS_OVERRIDE
forbidden_claims:
- model_approval_is_authority
- deployment_command_success_means_fix_success
- internal_scheduler_done_means_bug_closed
- local_evidence_substitutes_for_protected_evidence
