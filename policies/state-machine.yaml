version: 2
mode: FAIL_CONTAINED_NEVER_IDLE
authoritative_bug_lifecycle:
  terminal_scheduler_state: INTERNAL_EXECUTION_COMPLETE
  scheduler_states_are_subordinate: true
  prohibited_bug_closure_states: [DONE, MERGE_READY, PRODUCTION_VERIFIED]
  done_is_internal_only: true
states:
  - BACKLOG
  - READY
  - PLANNING
  - WORKER_IMPLEMENTING
  - MACHINE_CHECKS
  - SUPERVISOR_REVIEW
  - AUTO_REPAIR
  - AUTO_REPLAN
  - SUPERVISOR_TAKEOVER
  - CLOSURE_REVIEW
  - CLEAN_RECONSTRUCTION
  - WAITING_RETRY
  - WAITING_EXTERNAL_DEPENDENCY
  - QUARANTINED
  - MERGE_READY
  - MERGE_QUEUED
  - MERGED
  - ARTIFACT_VERIFIED
  - STAGING
  - CANARY
  - ROLLBACK
  - ROLLED_BACK_RETRYABLE
  - PRODUCTION_VERIFIED
  - INTERNAL_EXECUTION_COMPLETE
  - DONE
  - CANCELLED
  - SUPERSEDED
transitions:
  BACKLOG: [READY, CANCELLED, SUPERSEDED]
  READY: [PLANNING, WORKER_IMPLEMENTING, WAITING_EXTERNAL_DEPENDENCY, CANCELLED]
  PLANNING: [WORKER_IMPLEMENTING, AUTO_REPLAN, WAITING_RETRY, QUARANTINED]
  WORKER_IMPLEMENTING: [MACHINE_CHECKS, AUTO_REPAIR, AUTO_REPLAN, SUPERVISOR_TAKEOVER, WAITING_RETRY, QUARANTINED]
  MACHINE_CHECKS: [SUPERVISOR_REVIEW, AUTO_REPAIR, AUTO_REPLAN, WAITING_RETRY, QUARANTINED]
  SUPERVISOR_REVIEW: [MERGE_READY, AUTO_REPAIR, AUTO_REPLAN, SUPERVISOR_TAKEOVER, WAITING_RETRY, QUARANTINED]
  AUTO_REPAIR: [WORKER_IMPLEMENTING, MACHINE_CHECKS, AUTO_REPLAN, SUPERVISOR_TAKEOVER, WAITING_RETRY, QUARANTINED]
  AUTO_REPLAN: [WORKER_IMPLEMENTING, SUPERVISOR_TAKEOVER, CLEAN_RECONSTRUCTION, WAITING_RETRY, QUARANTINED]
  SUPERVISOR_TAKEOVER: [MACHINE_CHECKS, CLOSURE_REVIEW, CLEAN_RECONSTRUCTION, WAITING_RETRY, QUARANTINED]
  CLOSURE_REVIEW: [MERGE_READY, AUTO_REPAIR, AUTO_REPLAN, CLEAN_RECONSTRUCTION, QUARANTINED]
  CLEAN_RECONSTRUCTION: [PLANNING, WORKER_IMPLEMENTING, WAITING_RETRY, QUARANTINED]
  WAITING_RETRY: [WORKER_IMPLEMENTING, AUTO_REPLAN, SUPERVISOR_TAKEOVER, CLEAN_RECONSTRUCTION, QUARANTINED, CANCELLED]
  WAITING_EXTERNAL_DEPENDENCY: [READY, AUTO_REPLAN, QUARANTINED, CANCELLED]
  QUARANTINED: [AUTO_REPLAN, CLEAN_RECONSTRUCTION, WAITING_RETRY, CANCELLED, SUPERSEDED]
  MERGE_READY: [MERGE_QUEUED, STAGING, WAITING_RETRY, QUARANTINED]
  MERGE_QUEUED: [MERGED, AUTO_REPLAN, WAITING_RETRY, QUARANTINED]
  MERGED: [ARTIFACT_VERIFIED, ROLLBACK, QUARANTINED]
  ARTIFACT_VERIFIED: [STAGING, CANARY, ROLLBACK, QUARANTINED]
  STAGING: [CANARY, PRODUCTION_VERIFIED, ROLLBACK, WAITING_RETRY, QUARANTINED]
  CANARY: [PRODUCTION_VERIFIED, ROLLBACK, WAITING_RETRY, QUARANTINED]
  ROLLBACK: [ROLLED_BACK_RETRYABLE, DONE, QUARANTINED]
  ROLLED_BACK_RETRYABLE: [AUTO_REPLAN, CLEAN_RECONSTRUCTION, WAITING_RETRY, QUARANTINED]
  PRODUCTION_VERIFIED: [INTERNAL_EXECUTION_COMPLETE, DONE, ROLLBACK]
  INTERNAL_EXECUTION_COMPLETE: []
  DONE: []
  CANCELLED: []
  SUPERSEDED: []
gates:
  READY:
    required_evidence: [CHANGE_CONTRACT_VALID]
    minimum_trust: E2
  WORKER_IMPLEMENTING:
    by_risk:
      R2: {required_evidence: [SUPERVISOR_PLAN_APPROVAL]}
      R3: {required_evidence: [SUPERVISOR_PLAN_APPROVAL]}
      R4: {required_evidence: [SUPERVISOR_PLAN_APPROVAL, REVERSIBILITY_PLAN, BACKUP_RESTORE_PLAN]}
    minimum_trust: E2
  MACHINE_CHECKS:
    required_evidence: [LOCAL_CHECKS]
    minimum_trust: E2
  SUPERVISOR_REVIEW:
    required_evidence: [PROTECTED_CI, EXACT_SHA_BOUND]
    minimum_trust: E3
  CLOSURE_REVIEW:
    required_evidence: [SUPERVISOR_TAKEOVER_RUN, PROTECTED_CI]
    minimum_trust: E3
  MERGE_READY:
    by_risk:
      R0: {required_evidence: [REQUIRED_CHECKS_VERIFIED]}
      R1: {required_evidence: [REQUIRED_CHECKS_VERIFIED, SUPERVISOR_DIFF_APPROVAL]}
      R2: {required_evidence: [REQUIRED_CHECKS_VERIFIED, SUPERVISOR_DIFF_APPROVAL, VALIDATED_FINDINGS]}
      R3: {required_evidence: [REQUIRED_CHECKS_VERIFIED, SUPERVISOR_ADVERSARIAL_APPROVAL, VALIDATED_FINDINGS, ROLLBACK_VERIFIED]}
      R4: {required_evidence: [REQUIRED_CHECKS_VERIFIED, CLOSURE_APPROVAL, VALIDATED_FINDINGS, REVERSIBILITY_VERIFIED, BACKUP_RESTORE_EVIDENCE]}
    minimum_trust: E3
  ARTIFACT_VERIFIED:
    required_evidence: [SIGNED_BUILD, SBOM, PROVENANCE_VERIFIED]
    minimum_trust: E4
  STAGING:
    required_evidence: [EXPECTED_DIGEST, STAGING_SMOKE]
    minimum_trust: E4
  CANARY:
    required_evidence: [SUPERVISOR_RELEASE_APPROVAL, EXPECTED_DIGEST, ROLLBACK_VERIFIED]
    minimum_trust: E4
  PRODUCTION_VERIFIED:
    required_evidence: [PRODUCTION_HEALTH, SYNTHETIC_TRANSACTION, OBSERVATION_WINDOW]
    minimum_trust: E5
continuity_decisions:
  no_permitted_transition: CONTAIN_TASK_AND_CONTINUE_SCHEDULER
  missing_external_dependency: WAITING_EXTERNAL_DEPENDENCY
  transient_failure: WAITING_RETRY
  repeated_worker_failure: SUPERVISOR_TAKEOVER
  repeated_supervisor_failure: CLEAN_RECONSTRUCTION
  unsafe_nonretryable_failure: QUARANTINED
