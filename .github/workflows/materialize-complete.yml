name: Materialize complete verified ZTAD Mesh 4.2.0 source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-complete.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: ztad-materialize-complete-4-2-0
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_B64_LENGTH: "315912"
      EXPECTED_B64_SHA256: c0df972370ca99d728b23b982572d7479f2788e3231c681f7ae24a6d9f9542d4
      EXPECTED_ARCHIVE_BYTES: "236932"
      EXPECTED_ARCHIVE_SHA256: 23bb0357a0900a0c4dfa1110da1d5d08c0f8aa5cae95622e55b06a124a3a272c
      EXPECTED_FILE_COUNT: "253"
      EXPECTED_UNCOMPRESSED_BYTES: "1255479"
      EXPECTED_GIT_TREE: 1f168ae648eccb935ccd54c6f0d6f644d24dd095

    steps:
      - name: Check out current bootstrap revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct, verify, and safely extract source
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import subprocess
          import tarfile
          import unicodedata

          owner = "alihus294"
          expected_part0_segments = {
              0: (8000, "9748296b3cdfd30afbc88e534a68c1c496fb70e376c783fe1ddb4e713b1a49f3"),
              1: (8000, "2c179cc0a8ef56c8e9785b73294d92127ebd5c6321564b7b1241295047c98735"),
              2: (8000, "5f4dab8c35cd74ec6721098fa62d8bbf3bbb8d7dd33a8fe02256f5d014d9868d"),
              3: (8000, "d148076270bb1d2e3c5aba7e4eff741160c14c010567d33f397e214f09f6f221"),
              4: (8000, "71e4dc574c04e2b94557aba302da0bf4a60637872e2909c9229f585fec9b848d"),
              5: (8000, "935a7012b0faa4d9a9ea98a2222365e96833b8906c1f913d4b13ff618e0027df"),
              6: (4000, "a0b262dbe64ceaca26fd17f10a34a884a8fd586bc15c1837d319bb446359e8fd"),
          }
          expected_segmented_parts = {
              1: {
                  0: (16000, "2b73fdcf812c511404ccd01ae5e7bbad87781f5695c964bd52b46b31ed20edf0"),
                  1: (16000, "2e3720f3b88132e1e9368b37d45a5307cefc0eda82c32ceeac5d8d0c906f6014"),
                  2: (16000, "9212fb924c0e7759cf43b773184b6d5cd0c6d30374e0c52035c870ba6d044d1d"),
                  3: (4000, "cbfcd8e4b385d833b2ca994d4d2c59ed863b09fbb085af9bf12821930ddda5db"),
              },
              2: {
                  0: (16000, "53e2625c3af3e5bb6ab9ac24443178e52ff876760f161c08a0916b1968df4956"),
                  1: (16000, "7bc11521de39c1344e8f8c36052669b832b9cea821417465b802f3cde99e42fb"),
                  2: (16000, "4fed85fad0aca65fec22c0bb50aae3f3bb0960c4da251c82b7a7a904b939c1f9"),
                  3: (4000, "abf942ec5a75da10351475fd5be966afab0fbd8c01f32fb584f79f902f7d47c3"),
              },
              3: {
                  0: (16000, "e7c4a0c0f62211235de87fbeec7369ede244e5a2b4a890659cdff1f633199fb0"),
                  1: (16000, "6d94b2ad7b83b213b58bf969bd76fd21ecda8ae5315995996a009a1ac1f11462"),
                  2: (16000, "564056cec9ea558b6dcdb20219594dad6e98b3d84537553b703030cbc73c4086"),
                  3: (4000, "b0e19b462c8c140f5290e04711b0aed5dc0f23a0bfb32599aa34edc40470edb1"),
              },
              4: {
                  0: (16000, "2304583bc2f7394acfb5ac0e0ffbf878afb623ba51747fb3fd40864f5e75f4ca"),
                  1: (16000, "27912ed84e19cefa2d07f2429f38c9b88abe4a07b0a2ce343835a9d02df42090"),
                  2: (16000, "94df9d65dccba759c39ee410da43142533ae4488b65757681231940182245e16"),
                  3: (4000, "bdede308357a5b06d28fc9a3da3f1da85900e0b714da1cfdd0274956a454b6d6"),
              },
              5: {
                  0: (16000, "3a237c823fe35b48d6668b875385bf172b0374a6772ed6f10b799b02a48de125"),
                  1: (16000, "469b22f6c511e58c1a277abe809db32e8c7e9ad363b85a1e59e3ebdaee6e2401"),
                  2: (16000, "1bd1fdbe8282cd14bc630ea4ea71a63959a79953c08588d7b370975a68bf5fe8"),
                  3: (4000, "229e06e8b0eafeb1ed3b693c05ba98e5873181eeb2c8c3fd947a0ba05414ba6d"),
              },
          }
          expected_part_hashes = {
              0: "dbe4040858965328ded64b964477a3fe7f721f8370f35ca1e3951a684fbe9570",
              1: "cb05798729cf6f0dbbcdcd5e8d4de5ee9c36ece394b99adcea3075c4366300ea",
              2: "e84b7f91815dc58c54637af3c926081af77d86e200ccc510899aa58d73828fe9",
              3: "e2b07c2d55a4151714b10335a4c4fd96308c9a1f0590fc686c8ea65b406e162d",
              4: "6ad4f2c680e10ca75185a05376d805a5994ae6936882f8400af6d6810ccc09b8",
              5: "b5fc690297177937a3aa81931390fbdfebbe39e9fabea3e3f8facbf68e801626",
              6: "ece567743ac650259d983c72c44666a1eccd8e8461ccf283a251801a59fa199a",
          }
          expected_part6 = (3912, expected_part_hashes[6])

          p0_pattern = re.compile(r"ZTAD_SOURCE_PART0_SEGMENT ([0-6]) ([0-9]+) ([0-9a-f]{64})")
          segmented_pattern = re.compile(r"ZTAD_SOURCE_PART([1-5])_SEGMENT ([0-3]) ([0-9]+) ([0-9a-f]{64})")
          part6_pattern = re.compile(r"ZTAD_SOURCE_PART 6 ([0-9]+) ([0-9a-f]{64})")

          comments = []
          for page_number in range(1, 100):
              result = subprocess.run(
                  [
                      "gh", "api",
                      f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/2/comments?per_page=100&page={page_number}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              page = json.loads(result.stdout)
              if not isinstance(page, list):
                  raise SystemExit("unexpected GitHub comments response")
              comments.extend(page)
              if len(page) < 100:
                  break
          else:
              raise SystemExit("comment pagination exceeded safety bound")

          part0_segments = {}
          segmented_parts = {part: {} for part in expected_segmented_parts}
          part6 = None

          def accept(container, key, payload, label):
              existing = container.get(key)
              if existing is not None and existing != payload:
                  raise SystemExit(f"conflicting valid {label}")
              container[key] = payload

          for comment in comments:
              if not isinstance(comment, dict):
                  continue
              if (comment.get("user") or {}).get("login") != owner:
                  continue
              body = comment.get("body")
              if not isinstance(body, str):
                  continue
              header, separator, raw_payload = body.partition("\n")
              if not separator:
                  continue
              payload = "".join(raw_payload.split())
              if not payload:
                  continue

              match = p0_pattern.fullmatch(header.strip())
              if match:
                  index = int(match.group(1))
                  declared_length = int(match.group(2))
                  declared_hash = match.group(3)
                  expected_length, expected_hash = expected_part0_segments[index]
                  actual_hash = hashlib.sha256(payload.encode("ascii")).hexdigest()
                  if (
                      declared_length == expected_length
                      and declared_hash == expected_hash
                      and len(payload) == expected_length
                      and actual_hash == expected_hash
                  ):
                      accept(part0_segments, index, payload, f"part-0 segment {index}")
                  continue

              match = segmented_pattern.fullmatch(header.strip())
              if match:
                  part = int(match.group(1))
                  segment = int(match.group(2))
                  declared_length = int(match.group(3))
                  declared_hash = match.group(4)
                  expected_length, expected_hash = expected_segmented_parts[part][segment]
                  actual_hash = hashlib.sha256(payload.encode("ascii")).hexdigest()
                  if (
                      declared_length == expected_length
                      and declared_hash == expected_hash
                      and len(payload) == expected_length
                      and actual_hash == expected_hash
                  ):
                      accept(segmented_parts[part], segment, payload, f"part {part} segment {segment}")
                  continue

              match = part6_pattern.fullmatch(header.strip())
              if match:
                  declared_length = int(match.group(1))
                  declared_hash = match.group(2)
                  expected_length, expected_hash = expected_part6
                  actual_hash = hashlib.sha256(payload.encode("ascii")).hexdigest()
                  if (
                      declared_length == expected_length
                      and declared_hash == expected_hash
                      and len(payload) == expected_length
                      and actual_hash == expected_hash
                  ):
                      if part6 is not None and part6 != payload:
                          raise SystemExit("conflicting valid part 6")
                      part6 = payload

          if set(part0_segments) != set(expected_part0_segments):
              missing = sorted(set(expected_part0_segments) - set(part0_segments))
              raise SystemExit(f"missing valid part-0 segments: {missing}")

          reconstructed_parts = {}
          reconstructed_parts[0] = "".join(part0_segments[index] for index in range(7))
          for part, expected_segments in expected_segmented_parts.items():
              actual_segments = segmented_parts[part]
              if set(actual_segments) != set(expected_segments):
                  missing = sorted(set(expected_segments) - set(actual_segments))
                  raise SystemExit(f"missing valid part {part} segments: {missing}")
              reconstructed_parts[part] = "".join(actual_segments[index] for index in range(4))
          if part6 is None:
              raise SystemExit("missing valid part 6")
          reconstructed_parts[6] = part6

          for part in range(7):
              expected_length = 3912 if part == 6 else 52000
              payload = reconstructed_parts[part]
              if len(payload) != expected_length:
                  raise SystemExit(f"part {part} length mismatch: {len(payload)}")
              actual_hash = hashlib.sha256(payload.encode("ascii")).hexdigest()
              if actual_hash != expected_part_hashes[part]:
                  raise SystemExit(f"part {part} SHA-256 mismatch: {actual_hash}")

          encoded = "".join(reconstructed_parts[part] for part in range(7))
          if len(encoded) != int(os.environ["EXPECTED_B64_LENGTH"]):
              raise SystemExit(f"concatenated Base64 length mismatch: {len(encoded)}")
          encoded_hash = hashlib.sha256(encoded.encode("ascii")).hexdigest()
          if encoded_hash != os.environ["EXPECTED_B64_SHA256"]:
              raise SystemExit(f"concatenated Base64 SHA-256 mismatch: {encoded_hash}")

          try:
              archive_bytes = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              raise SystemExit(f"invalid Base64 transport: {exc}") from exc
          if len(archive_bytes) != int(os.environ["EXPECTED_ARCHIVE_BYTES"]):
              raise SystemExit(f"archive byte count mismatch: {len(archive_bytes)}")
          archive_hash = hashlib.sha256(archive_bytes).hexdigest()
          if archive_hash != os.environ["EXPECTED_ARCHIVE_SHA256"]:
              raise SystemExit(f"archive SHA-256 mismatch: {archive_hash}")

          destination = Path(os.environ["RUNNER_TEMP"]) / "ztad-source"
          destination.mkdir(parents=True, exist_ok=False)
          resolved_destination = destination.resolve()
          seen_exact = set()
          seen_casefold = set()
          total_size = 0

          with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:xz") as bundle:
              members = bundle.getmembers()
              if len(members) != int(os.environ["EXPECTED_FILE_COUNT"]):
                  raise SystemExit(f"archive member count mismatch: {len(members)}")

              validated = []
              for member in members:
                  raw_name = member.name[2:] if member.name.startswith("./") else member.name
                  normalized_name = unicodedata.normalize("NFC", raw_name)
                  path = PurePosixPath(normalized_name)
                  if not normalized_name or path.is_absolute() or "." in path.parts or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if "\\" in normalized_name or ":" in path.parts[0]:
                      raise SystemExit(f"non-portable archive path: {member.name}")
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f"unsupported archive member: {member.name}")
                  exact_key = path.as_posix()
                  folded_key = exact_key.casefold()
                  if exact_key in seen_exact or folded_key in seen_casefold:
                      raise SystemExit(f"duplicate or case-colliding archive path: {member.name}")
                  seen_exact.add(exact_key)
                  seen_casefold.add(folded_key)
                  target = (destination / Path(*path.parts)).resolve()
                  if os.path.commonpath([str(resolved_destination), str(target)]) != str(resolved_destination):
                      raise SystemExit(f"archive path escapes destination: {member.name}")
                  total_size += member.size
                  if member.size > 16_000_000 or total_size > 2_000_000:
                      raise SystemExit("archive exceeds bounded extraction limits")
                  validated.append((member, target))

              if total_size != int(os.environ["EXPECTED_UNCOMPRESSED_BYTES"]):
                  raise SystemExit(f"uncompressed byte count mismatch: {total_size}")

              for member, target in validated:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  stream = bundle.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"cannot read archive member: {member.name}")
                  data = stream.read()
                  if len(data) != member.size:
                      raise SystemExit(f"short read for archive member: {member.name}")
                  target.write_bytes(data)
                  target.chmod(member.mode & 0o777)

          required_paths = (
              "VERSION",
              ".codex-plugin/plugin.json",
              ".github/workflows/ci.yml",
              "hooks/hooks.json",
              "scripts/ztad.py",
              "toolkit/ztad/mesh_runtime.py",
              "skills/zero-trust-delivery/SKILL.md",
              "policies/model-routing.yaml",
              "schemas/change-contract.schema.json",
              "tests",
          )
          for relative_path in required_paths:
              if not (destination / relative_path).exists():
                  raise SystemExit(f"required source path is missing: {relative_path}")
          if (destination / "VERSION").read_text(encoding="utf-8").strip() != "4.2.0":
              raise SystemExit("unexpected VERSION value")

          print(
              json.dumps(
                  {
                      "comments": len(comments),
                      "archive_sha256": archive_hash,
                      "files": len(seen_exact),
                      "uncompressed_bytes": total_size,
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Replace temporary tree with exact verified source
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$RUNNER_TEMP/ztad-source/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          ACTUAL_TREE="$(git write-tree)"
          test "$ACTUAL_TREE" = "$EXPECTED_GIT_TREE" || {
            echo "final Git tree mismatch: actual=$ACTUAL_TREE expected=$EXPECTED_GIT_TREE" >&2
            exit 1
          }
          git diff --cached --quiet && {
            echo "materialization produced no changes" >&2
            exit 1
          }
          git commit -m "release: publish ZTAD Mesh 4.2.0 exact verified source"
          git push origin HEAD:main
