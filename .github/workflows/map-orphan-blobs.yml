name: Map reusable source blobs

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/map-orphan-blobs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Build and commit mapping
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, os, subprocess
          blobs = [
            '1a43c6385c3c83f9e15e62ec4e99ffbf2a2f8641',
            'c6d64de69fa477375c27dd26746bf6ae9a8270ce',
            '9411d44638e63ca43ec814047a339bc3e17cebdf',
            '3487e3b8e9b1b613fddbd76ba956463e8d650560',
            '6c9d1e94451c814f3822b0687fa9a03e29b6d792',
            '30d74d258442c7c65512eafab474568dd706c430',
            'b6fc4c620b67d95f953a5c1c1230aaab5db5a1b0',
            '644ca168f7ef42d8ef00cd6b34acb7a41c4e574f',
          ]
          repository = os.environ['GITHUB_REPOSITORY']
          rows=[]
          for sha in blobs:
              item=json.loads(subprocess.run(['gh','api',f'repos/{repository}/git/blobs/{sha}'],check=True,capture_output=True,text=True).stdout)
              text=base64.b64decode(''.join(item['content'].split()),validate=True).decode('ascii')
              rows.append({'git_sha':sha,'length':len(text),'sha256':hashlib.sha256(text.encode()).hexdigest(),'prefix':text[:96],'suffix':text[-96:]})
          Path('orphan-blob-map.json').write_text(json.dumps(rows,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add orphan-blob-map.json
          git commit -m "chore: map reusable source transport blobs"
          git push origin HEAD:main
