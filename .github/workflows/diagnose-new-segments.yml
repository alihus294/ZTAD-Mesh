name: Diagnose newly uploaded source segments

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-new-segments.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect segmented source comments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          pattern = re.compile(r'ZTAD_SOURCE_PART([1-4])_SEGMENT ([0-3]) ([0-9]+) ([0-9a-f]{64})')
          comments = []
          for page_number in range(1, 30):
              result = subprocess.run(
                  ['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/issues/2/comments?per_page=100&page={page_number}'],
                  check=True, capture_output=True, text=True,
              )
              page = json.loads(result.stdout)
              comments.extend(page)
              if len(page) < 100:
                  break
          found = 0
          for item in comments:
              if (item.get('user') or {}).get('login') != 'alihus294':
                  continue
              body = item.get('body')
              if not isinstance(body, str):
                  continue
              header, separator, raw = body.partition('\n')
              match = pattern.fullmatch(header.strip())
              if not separator or not match:
                  continue
              payload = ''.join(raw.split())
              digest = hashlib.sha256(payload.encode('ascii')).hexdigest()
              ok = len(payload) == int(match.group(3)) and digest == match.group(4)
              print(f'::notice title=segment-{match.group(1)}-{match.group(2)}::comment={item.get("id")} length={len(payload)} sha256={digest} ok={str(ok).lower()}')
              found += 1
          print(f'::notice title=segment-count::{found}')
          PY
