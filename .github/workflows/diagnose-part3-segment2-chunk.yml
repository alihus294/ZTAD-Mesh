name: Verify repair chunk for part 3 segment 2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-part3-segment2-chunk.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5239690730" > "$RUNNER_TEMP/comment.json"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          item=json.loads((Path(os.environ['RUNNER_TEMP'])/'comment.json').read_text())
          header,sep,raw=item['body'].partition('\n')
          payload=''.join(raw.split())
          digest=hashlib.sha256(payload.encode('ascii')).hexdigest()
          print(f'header={header}')
          print(f'length={len(payload)} sha256={digest}')
          assert len(payload)==4000
          assert digest=='d92ed531cf2de984f1b68f9de463192274a6864dd234a3fe8ca38f2c6cb37828'
          PY
