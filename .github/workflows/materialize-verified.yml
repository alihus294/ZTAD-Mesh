name: Materialize verified ZTAD Mesh 4.2.0 source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-verified.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: ztad-materialize-verified-4-2-0
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_GIT_TREE: 1f168ae648eccb935ccd54c6f0d6f644d24dd095

    steps:
      - name: Check out bootstrap revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch checksummed source transport
        shell: bash
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/2/comments?per_page=100" > "$RUNNER_TEMP/source-comments.json"

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, json, os, re, tarfile

          segments = {
              0: (8000, "9748296b3cdfd30afbc88e534a68c1c496fb70e376c783fe1ddb4e713b1a49f3"),
              1: (8000, "2c179cc0a8ef56c8e9785b73294d92127ebd5c6321564b7b1241295047c98735"),
              2: (8000, "5f4dab8c35cd74ec6721098fa62d8bbf3bbb8d7dd33a8fe02256f5d014d9868d"),
              3: (8000, "d148076270bb1d2e3c5aba7e4eff741160c14c010567d33f397e214f09f6f221"),
              4: (8000, "71e4dc574c04e2b94557aba302da0bf4a60637872e2909c9229f585fec9b848d"),
              5: (8000, "935a7012b0faa4d9a9ea98a2222365e96833b8906c1f913d4b13ff618e0027df"),
              6: (4000, "a0b262dbe64ceaca26fd17f10a34a884a8fd586bc15c1837d319bb446359e8fd"),
          }
          parts = {
              1: (52000, "cb05798729cf6f0dbbcdcd5e8d4de5ee9c36ece394b99adcea3075c4366300ea"),
              2: (52000, "e84b7f91815dc58c54637af3c926081af77d86e200ccc510899aa58d73828fe9"),
              3: (52000, "e2b07c2d55a4151714b10335a4c4fd96308c9a1f0590fc686c8ea65b406e162d"),
              4: (52000, "6ad4f2c680e10ca75185a05376d805a5994ae6936882f8400af6d6810ccc09b8"),
              5: (52000, "b5fc690297177937a3aa81931390fbdfebbe39e9fabea3e3f8facbf68e801626"),
              6: (3912, "ece567743ac650259d983c72c44666a1eccd8e8461ccf283a251801a59fa199a"),
          }
          patterns = (
              (re.compile(r"ZTAD_SOURCE_PART0_SEGMENT ([0-6]) ([0-9]+) ([0-9a-f]{64})"), segments, {}),
              (re.compile(r"ZTAD_SOURCE_PART ([1-6]) ([0-9]+) ([0-9a-f]{64})"), parts, {}),
          )
          comments = json.loads((Path(os.environ["RUNNER_TEMP"]) / "source-comments.json").read_text())
          for comment in comments:
              if (comment.get("user") or {}).get("login") != "alihus294":
                  continue
              header, separator, payload = (comment.get("body") or "").partition("\n")
              if not separator:
                  continue
              payload = payload.rstrip("\r\n")
              if any(character.isspace() for character in payload):
                  continue
              for pattern, expected, found in patterns:
                  match = pattern.fullmatch(header.strip())
                  if not match:
                      continue
                  index = int(match.group(1))
                  length, digest = expected[index]
                  actual = hashlib.sha256(payload.encode("ascii")).hexdigest()
                  if int(match.group(2)) == length and match.group(3) == digest and len(payload) == length and actual == digest:
                      if index in found and found[index] != payload:
                          raise SystemExit(f"conflicting valid source item {index}")
                      found[index] = payload
                  break

          segment_data, part_data = patterns[0][2], patterns[1][2]
          if set(segment_data) != set(segments):
              raise SystemExit(f"missing valid part-0 segments: {sorted(set(segments) - set(segment_data))}")
          if set(part_data) != set(parts):
              raise SystemExit(f"missing valid source parts: {sorted(set(parts) - set(part_data))}")

          encoded = "".join(segment_data[index] for index in range(7)) + "".join(part_data[index] for index in range(1, 7))
          if len(encoded) != 315912 or hashlib.sha256(encoded.encode("ascii")).hexdigest() != "c0df972370ca99d728b23b982572d7479f2788e3231c681f7ae24a6d9f9542d4":
              raise SystemExit("assembled Base64 transport mismatch")
          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != 236932 or hashlib.sha256(archive).hexdigest() != "23bb0357a0900a0c4dfa1110da1d5d08c0f8aa5cae95622e55b06a124a3a272c":
              raise SystemExit("source archive mismatch")

          destination = Path(os.environ["RUNNER_TEMP"]) / "ztad-source"
          destination.mkdir()
          root = destination.resolve()
          seen, validated, total = set(), [], 0
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:xz") as bundle:
              members = bundle.getmembers()
              if len(members) != 253:
                  raise SystemExit(f"archive member count mismatch: {len(members)}")
              for member in members:
                  name = member.name[2:] if member.name.startswith("./") else member.name
                  path = PurePosixPath(name)
                  if not name or path.is_absolute() or any(part in ("", ".", "..") for part in path.parts) or "\\" in name or ":" in path.parts[0] or not member.isfile():
                      raise SystemExit(f"unsafe archive member: {member.name}")
                  key = path.as_posix().casefold()
                  if key in seen:
                      raise SystemExit(f"duplicate archive path: {member.name}")
                  seen.add(key)
                  target = (destination / Path(*path.parts)).resolve()
                  if os.path.commonpath([str(root), str(target)]) != str(root):
                      raise SystemExit(f"archive path escapes destination: {member.name}")
                  total += member.size
                  if member.size > 16_000_000 or total > 2_000_000:
                      raise SystemExit("archive exceeds extraction limits")
                  validated.append((member, target))
              if total != 1_255_479:
                  raise SystemExit(f"uncompressed byte count mismatch: {total}")
              for member, target in validated:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  stream = bundle.extractfile(member)
                  data = stream.read() if stream else b""
                  if len(data) != member.size:
                      raise SystemExit(f"short archive read: {member.name}")
                  target.write_bytes(data)
                  target.chmod(member.mode & 0o777)

          required = ("VERSION", ".github/workflows/ci.yml", ".codex-plugin/plugin.json", "scripts/ztad.py", "toolkit/ztad/mesh_runtime.py", "tests")
          if any(not (destination / item).exists() for item in required) or (destination / "VERSION").read_text().strip() != "4.2.0":
              raise SystemExit("required source content is missing")
          PY

      - name: Publish source with workflow handoff preserved
        shell: bash
        run: |
          set -Eeuo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' "$RUNNER_TEMP/ztad-source/" ./
          test -z "$(rsync -aicn --delete --itemize-changes --exclude='.git/' --exclude='.github/workflows/' "$RUNNER_TEMP/ztad-source/" ./)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git diff --cached --check
          git commit -m "release: materialize ZTAD Mesh 4.2.0 verified source"
          git push origin HEAD:main
