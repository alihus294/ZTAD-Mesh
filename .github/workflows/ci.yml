name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            toolkit/pyproject.toml
            toolkit/requirements.lock.txt
            toolkit/requirements-dev.lock.txt

      - name: Install exact test environment
        run: python -m pip install --disable-pip-version-check -r toolkit/requirements-dev.lock.txt

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Verify current release identity
        run: python -B scripts/verify_version_identity.py --profile source

      - name: Compile Python sources
        run: python -m compileall -q toolkit scripts evals tests

      - name: Run unit and integration tests
        env:
          PYTHONPATH: toolkit
        run: python -B -m pytest -q

      - name: Fail on resource leaks in critical v4.3 controls
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        env:
          PYTHONPATH: toolkit
        run: >-
          python -B -m pytest -q -W error::ResourceWarning
          tests/test_v43_last_gaps.py
          tests/test_v43_final_hardening.py
          tests/test_v43_runtime_controls.py
          tests/test_v43_guarded_fast_path.py

      - name: Run offline functional and adversarial evals
        run: python -B evals/run_evals.py --output "${{ runner.temp }}/eval-summary.json"

      - name: Validate plugin bundle
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/bundle-validation.json" validate-bundle --root .

      - name: Verify policy wiring
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/policy-wiring.json" policy-wiring --root .

      - name: Resolve distribution version
        run: python -c "import os,pathlib,re; v=pathlib.Path('VERSION').read_text(encoding='utf-8').strip(); assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:[-.+][0-9A-Za-z.-]+)?', v), v; open(os.environ['GITHUB_ENV'],'a',encoding='utf-8').write('ZTAD_VERSION='+v+'\n')"

      - name: Build Marketplace for packaged install regression
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/install-distribution.json" build-distribution --root . --output-dir "${{ runner.temp }}/install-dist"

      - name: Run packaged install-critical regressions
        run: >-
          python -B scripts/run_packaged_regressions.py
          --archive "${{ runner.temp }}/install-dist/zero-trust-agentic-delivery-marketplace-${{ env.ZTAD_VERSION }}.zip"
          --kind marketplace
          --scope install-critical

      - name: Re-run packaged regressions from isolated Windows venv
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = Join-Path $env:RUNNER_TEMP 'ztad-packaged-venv'
          python -m venv $venv
          $venvPython = Join-Path $venv 'Scripts\python.exe'
          & $venvPython -m pip install --disable-pip-version-check -r toolkit/requirements-dev.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $venvPython -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = Join-Path $env:RUNNER_TEMP "install-dist\zero-trust-agentic-delivery-marketplace-$env:ZTAD_VERSION.zip"
          & $venvPython -I -B scripts/run_packaged_regressions.py --archive $archive --kind marketplace --scope install-critical
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set commit-derived reproducible build timestamp
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build first deterministic distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/distribution-a.json" build-distribution --root . --output-dir "${{ runner.temp }}/dist-a"

      - name: Build second deterministic distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/distribution-b.json" build-distribution --root . --output-dir "${{ runner.temp }}/dist-b"

      - name: Compare deterministic distribution trees
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: diff -qr "${{ runner.temp }}/dist-a" "${{ runner.temp }}/dist-b"

      - name: Validate built Plugin archive
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: python -B scripts/ztad.py validate-distribution --archive "${RUNNER_TEMP}/dist-a/zero-trust-agentic-delivery-plugin-${ZTAD_VERSION}.zip" --kind plugin

      - name: Validate built Marketplace archive
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: python -B scripts/ztad.py validate-distribution --archive "${RUNNER_TEMP}/dist-a/zero-trust-agentic-delivery-marketplace-${ZTAD_VERSION}.zip" --kind marketplace

      - name: Prove repository remained unchanged
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || {
            git status --short
            exit 1
          }
