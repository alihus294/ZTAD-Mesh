name: Publish owner-authored verified source part 4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-owner-part4.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Patch owner placeholders with verified canonical segments
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, subprocess, tempfile

          repo = os.environ['GITHUB_REPOSITORY']
          owner = 'alihus294'
          chunk_specs = {
              (0,0):(5239859933,'d589859e41fa4be1ef2129297c8987c0f0b89bdb16e9e59762dc8f74364adcdd'),
              (0,1):(5239873243,'4624f43b8888e75241b4a938e1a4db2303bfa6b30b767206cc7dc624f12c1cad'),
              (0,2):(5239887194,'996231719d3575943247e842aea40c3cc87c81e85d4ed9909e859f56fd57ae47'),
              (0,3):(5239923685,'b2b84c3531aa9d4bd2ad5e6a5ff30c37df6a557e5e0118b806e3ecfaa165b4d0'),
              (1,0):(5239940591,'e5612fbb55b5b85eef6f1a398b111f54ee7ba815df604e023054f62aa179477f'),
              (1,1):(5239963839,'31645d89e073d8861e80114c61ccf97379ff57364a882b733fb4d26ac0fbe913'),
              (1,2):(5239986267,'588050053c6ec3e5500562d418c51b8c57d0dd26f47b87c434e94bde1d5363ec'),
              (1,3):(5240009368,'48b75d87dfc8948ab18e8c022686f55575d26b0c4e78df7a311304da430a98c7'),
              (2,0):(5240031707,'2c0252b9ff6edf846b9972050e653afcb719735a2d31f02883adabd28237264b'),
              (2,1):(5240053799,'c6423f57b24a5e01d79b31580312b09ab01d0e013962850b294cac3a3ef81e45'),
              (2,2):(5240079858,'84dcc69e305f59ed0960f417a2bfcf0f2273dec39e9a12b506dc2e867f6f9c04'),
              (2,3):(5240102782,'6a642902c65c34b529e18111f7c6d8808dd1e750eff30934666c31975d4f9bf2'),
              (3,0):(5240124217,'bdede308357a5b06d28fc9a3da3f1da85900e0b714da1cfdd0274956a454b6d6'),
          }
          segment_specs = {
              0:(16000,'2304583bc2f7394acfb5ac0e0ffbf878afb623ba51747fb3fd40864f5e75f4ca',5240196198),
              1:(16000,'27912ed84e19cefa2d07f2429f38c9b88abe4a07b0a2ce343835a9d02df42090',5240198840),
              2:(16000,'94df9d65dccba759c39ee410da43142533ae4488b65757681231940182245e16',5240201630),
              3:(4000,'bdede308357a5b06d28fc9a3da3f1da85900e0b714da1cfdd0274956a454b6d6',5240204245),
          }
          chunk_re = re.compile(r'ZTAD_SOURCE_PART4_SEGMENT_CHUNK ([0-3]) ([0-3]) 4000 ([0-9a-f]{64})')
          canonical_re = re.compile(r'ZTAD_SOURCE_PART4_SEGMENT ([0-3]) ([0-9]+) ([0-9a-f]{64})')

          def get_comment(comment_id):
              return json.loads(subprocess.run(['gh','api',f'repos/{repo}/issues/comments/{comment_id}'],check=True,capture_output=True,text=True).stdout)

          chunks = {}
          for key,(comment_id,expected_hash) in chunk_specs.items():
              item = get_comment(comment_id)
              header,sep,raw = item['body'].partition('\n')
              match = chunk_re.fullmatch(header.strip()) if sep else None
              payload = ''.join(raw.split()) if sep else ''
              digest = hashlib.sha256(payload.encode('ascii')).hexdigest()
              if not match or (int(match.group(1)),int(match.group(2))) != key or match.group(3) != expected_hash or len(payload) != 4000 or digest != expected_hash:
                  raise SystemExit(f'invalid chunk {key}: length={len(payload)} hash={digest}')
              chunks[key] = payload

          segments = {}
          for index,(expected_length,expected_hash,comment_id) in segment_specs.items():
              count = 4 if index < 3 else 1
              payload = ''.join(chunks[(index,chunk)] for chunk in range(count))
              digest = hashlib.sha256(payload.encode('ascii')).hexdigest()
              if len(payload) != expected_length or digest != expected_hash:
                  raise SystemExit(f'segment {index} integrity failure: length={len(payload)} hash={digest}')
              placeholder = get_comment(comment_id)
              if (placeholder.get('user') or {}).get('login') != owner:
                  raise SystemExit(f'placeholder {index} is not owner-authored')
              segments[index] = payload

          part = ''.join(segments[index] for index in range(4))
          part_hash = hashlib.sha256(part.encode('ascii')).hexdigest()
          if len(part) != 52000 or part_hash != '6ad4f2c680e10ca75185a05376d805a5994ae6936882f8400af6d6810ccc09b8':
              raise SystemExit(f'part 4 integrity failure: length={len(part)} hash={part_hash}')

          for index,payload in segments.items():
              expected_length,expected_hash,comment_id = segment_specs[index]
              request = {'body':f'ZTAD_SOURCE_PART4_SEGMENT {index} {expected_length} {expected_hash}\n{payload}'}
              with tempfile.NamedTemporaryFile('w',encoding='utf-8',delete=False) as stream:
                  json.dump(request,stream,separators=(',',':'))
                  request_path=stream.name
              try:
                  subprocess.run(['gh','api','--method','PATCH',f'repos/{repo}/issues/comments/{comment_id}','--input',request_path],check=True,capture_output=True,text=True)
              finally:
                  Path(request_path).unlink(missing_ok=True)

          verified = {}
          for index,(expected_length,expected_hash,comment_id) in segment_specs.items():
              item = get_comment(comment_id)
              if (item.get('user') or {}).get('login') != owner:
                  raise SystemExit(f'canonical segment {index} lost owner authorship')
              header,sep,raw = item['body'].partition('\n')
              match = canonical_re.fullmatch(header.strip()) if sep else None
              payload = ''.join(raw.split()) if sep else ''
              digest = hashlib.sha256(payload.encode('ascii')).hexdigest()
              if not match or int(match.group(1)) != index or int(match.group(2)) != expected_length or match.group(3) != expected_hash or len(payload) != expected_length or digest != expected_hash:
                  raise SystemExit(f'provider verification failed for segment {index}: length={len(payload)} hash={digest}')
              verified[index] = comment_id
          print(json.dumps({'part':4,'length':len(part),'sha256':part_hash,'owner_comments':verified},sort_keys=True))
          PY
