name: Apply v4.3 last-gap fixes

on:
  push:
    branches:
      - feat/v4.3.0-guarded-fast-path

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: toolkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v4.3.0-guarded-fast-path
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolkit/requirements-dev.lock.txt
      - run: python -m pip install --disable-pip-version-check -r toolkit/requirements-dev.lock.txt
      - name: Apply last-gap fixes
        run: python validation/apply_v430_last_gaps.py
      - name: Compile and diff checks
        run: |
          python -m compileall -q toolkit tests
          git diff --check
      - name: Run critical last-gap regressions repeatedly
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "critical iteration $i"
            python -B -m pytest -q tests/test_v43_last_gaps.py tests/test_v43_final_hardening.py tests/test_v43_runtime_controls.py tests/test_v43_guarded_fast_path.py
          done
      - name: Run full suite and offline evals
        run: |
          python -B -m pytest -q
          python -B evals/run_evals.py --output "${{ runner.temp }}/eval-summary.json"
      - name: Validate bundle and policy wiring
        run: |
          python -B scripts/ztad.py validate-bundle --root .
          python -B scripts/ztad.py policy-wiring --root .
      - name: Commit validated last-gap fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!.github/workflows/apply-v430-last-gaps.yml' ':!validation/apply_v430_last_gaps.py'
          git diff --cached --check
          git commit -m "fix: close final routing and repair-state gaps"
          git push origin HEAD:feat/v4.3.0-guarded-fast-path
