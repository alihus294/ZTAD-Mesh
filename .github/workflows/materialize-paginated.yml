name: Materialize paginated verified ZTAD Mesh source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-paginated.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: ztad-materialize-paginated
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_B64_LENGTH: "315912"
      EXPECTED_B64_SHA256: c0df972370ca99d728b23b982572d7479f2788e3231c681f7ae24a6d9f9542d4
      EXPECTED_ARCHIVE_BYTES: "236932"
      EXPECTED_ARCHIVE_SHA256: 23bb0357a0900a0c4dfa1110da1d5d08c0f8aa5cae95622e55b06a124a3a272c
      EXPECTED_FILE_COUNT: "253"
      EXPECTED_UNCOMPRESSED_BYTES: "1255479"
      EXPECTED_GIT_TREE: 1f168ae648eccb935ccd54c6f0d6f644d24dd095

    steps:
      - name: Check out bootstrap revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and safely extract exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64
          import hashlib
          import io
          import json
          import os
          import re
          import subprocess
          import tarfile
          import unicodedata

          segment_specs = {
              0: (8000, "9748296b3cdfd30afbc88e534a68c1c496fb70e376c783fe1ddb4e713b1a49f3"),
              1: (8000, "2c179cc0a8ef56c8e9785b73294d92127ebd5c6321564b7b1241295047c98735"),
              2: (8000, "5f4dab8c35cd74ec6721098fa62d8bbf3bbb8d7dd33a8fe02256f5d014d9868d"),
              3: (8000, "d148076270bb1d2e3c5aba7e4eff741160c14c010567d33f397e214f09f6f221"),
              4: (8000, "71e4dc574c04e2b94557aba302da0bf4a60637872e2909c9229f585fec9b848d"),
              5: (8000, "935a7012b0faa4d9a9ea98a2222365e96833b8906c1f913d4b13ff618e0027df"),
              6: (4000, "56151e6dfb8d852279f7c143f840de148df25bfeab90a0b366391f0f0d11352d"),
          }
          part_specs = {
              1: (52000, "cb05798729cf6f0dbbcdcd5e8d4de5ee9c36ece394b99adcea3075c4366300ea"),
              2: (52000, "e84b7f91815dc58c54637af3c926081af77d86e200ccc510899aa58d73828fe9"),
              3: (52000, "e2b07c2d55a4151714b10335a4c4fd96308c9a1f0590fc686c8ea65b406e162d"),
              4: (52000, "6ad4f2c680e10ca75185a05376d805a5994ae6936882f8400af6d6810ccc09b8"),
              5: (52000, "b5fc690297177937a3aa81931390fbdfebbe39e9fabea3e3f8facbf68e801626"),
              6: (3912, "ece567743ac650259d983c72c44666a1eccd8e8461ccf283a251801a59fa199a"),
          }
          expected_part0_hash = "dbe4040858965328ded64b964477a3fe7f721f8370f35ca1e3951a684fbe9570"
          segment_re = re.compile(r"ZTAD_SOURCE_PART0_SEGMENT ([0-6]) ([0-9]+) ([0-9a-f]{64})")
          part_re = re.compile(r"ZTAD_SOURCE_PART ([1-6]) ([0-9]+) ([0-9a-f]{64})")

          repository = os.environ["GITHUB_REPOSITORY"]
          comments = []
          for page_number in range(1, 21):
              result = subprocess.run(
                  [
                      "gh",
                      "api",
                      f"repos/{repository}/issues/2/comments?per_page=100&page={page_number}",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              page = json.loads(result.stdout)
              if not isinstance(page, list):
                  raise SystemExit(f"unexpected comments response on page {page_number}")
              comments.extend(page)
              if len(page) < 100:
                  break
          else:
              raise SystemExit("comment pagination exceeded the bounded 20-page limit")

          segments = {}
          parts = {}
          for item in comments:
              if not isinstance(item, dict):
                  continue
              user = item.get("user") or {}
              if user.get("login") != "alihus294":
                  continue
              body = item.get("body")
              if not isinstance(body, str):
                  continue
              header, separator, raw_payload = body.partition("\n")
              if not separator:
                  continue
              payload = "".join(raw_payload.split())
              if not payload:
                  continue

              match = segment_re.fullmatch(header.strip())
              if match:
                  index = int(match.group(1))
                  declared_length = int(match.group(2))
                  declared_hash = match.group(3)
                  expected_length, expected_hash = segment_specs[index]
                  actual_hash = hashlib.sha256(payload.encode("ascii")).hexdigest()
                  if (
                      declared_length == expected_length
                      and declared_hash == expected_hash
                      and len(payload) == expected_length
                      and actual_hash == expected_hash
                  ):
                      existing = segments.get(index)
                      if existing is not None and existing != payload:
                          raise SystemExit(f"conflicting valid part-0 segment {index}")
                      segments[index] = payload
                  continue

              match = part_re.fullmatch(header.strip())
              if match:
                  index = int(match.group(1))
                  declared_length = int(match.group(2))
                  declared_hash = match.group(3)
                  expected_length, expected_hash = part_specs[index]
                  actual_hash = hashlib.sha256(payload.encode("ascii")).hexdigest()
                  if (
                      declared_length == expected_length
                      and declared_hash == expected_hash
                      and len(payload) == expected_length
                      and actual_hash == expected_hash
                  ):
                      existing = parts.get(index)
                      if existing is not None and existing != payload:
                          raise SystemExit(f"conflicting valid source part {index}")
                      parts[index] = payload

          if set(segments) != set(segment_specs):
              missing = sorted(set(segment_specs) - set(segments))
              raise SystemExit(f"missing valid part-0 segments: {missing}")
          if set(parts) != set(part_specs):
              missing = sorted(set(part_specs) - set(parts))
              raise SystemExit(f"missing valid source parts: {missing}")

          part0 = "".join(segments[index] for index in range(7))
          if len(part0) != 52000:
              raise SystemExit(f"part 0 length mismatch: {len(part0)}")
          if hashlib.sha256(part0.encode("ascii")).hexdigest() != expected_part0_hash:
              raise SystemExit("part 0 SHA-256 mismatch")

          encoded = part0 + "".join(parts[index] for index in range(1, 7))
          if len(encoded) != int(os.environ["EXPECTED_B64_LENGTH"]):
              raise SystemExit(f"concatenated Base64 length mismatch: {len(encoded)}")
          if hashlib.sha256(encoded.encode("ascii")).hexdigest() != os.environ["EXPECTED_B64_SHA256"]:
              raise SystemExit("concatenated Base64 SHA-256 mismatch")

          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != int(os.environ["EXPECTED_ARCHIVE_BYTES"]):
              raise SystemExit(f"archive size mismatch: {len(archive)}")
          if hashlib.sha256(archive).hexdigest() != os.environ["EXPECTED_ARCHIVE_SHA256"]:
              raise SystemExit("archive SHA-256 mismatch")

          destination = Path(os.environ["RUNNER_TEMP"]) / "source"
          destination.mkdir(parents=True, exist_ok=False)
          resolved_destination = destination.resolve()
          exact_paths = set()
          folded_paths = set()
          validated_members = []
          total_size = 0

          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:xz") as bundle:
              members = bundle.getmembers()
              if len(members) != int(os.environ["EXPECTED_FILE_COUNT"]):
                  raise SystemExit(f"archive member count mismatch: {len(members)}")

              for member in members:
                  raw_name = member.name[2:] if member.name.startswith("./") else member.name
                  normalized_name = unicodedata.normalize("NFC", raw_name)
                  path = PurePosixPath(normalized_name)
                  if (
                      not normalized_name
                      or path.is_absolute()
                      or "." in path.parts
                      or ".." in path.parts
                      or "\\" in normalized_name
                      or ":" in path.parts[0]
                  ):
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f"unsupported archive member: {member.name}")

                  exact_key = path.as_posix()
                  folded_key = exact_key.casefold()
                  if exact_key in exact_paths or folded_key in folded_paths:
                      raise SystemExit(f"duplicate or case-colliding archive path: {member.name}")
                  exact_paths.add(exact_key)
                  folded_paths.add(folded_key)

                  target = (destination / Path(*path.parts)).resolve()
                  if os.path.commonpath([str(resolved_destination), str(target)]) != str(resolved_destination):
                      raise SystemExit(f"archive path escapes destination: {member.name}")

                  total_size += member.size
                  if member.size > 16_000_000 or total_size > 2_000_000:
                      raise SystemExit("archive exceeds bounded extraction limits")
                  validated_members.append((member, target))

              if total_size != int(os.environ["EXPECTED_UNCOMPRESSED_BYTES"]):
                  raise SystemExit(f"uncompressed byte count mismatch: {total_size}")

              for member, target in validated_members:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  stream = bundle.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"cannot read archive member: {member.name}")
                  data = stream.read()
                  if len(data) != member.size:
                      raise SystemExit(f"short read for archive member: {member.name}")
                  target.write_bytes(data)
                  target.chmod(member.mode & 0o777)

          required_paths = (
              "VERSION",
              ".codex-plugin/plugin.json",
              ".github/workflows/ci.yml",
              "hooks/hooks.json",
              "scripts/ztad.py",
              "toolkit/ztad/mesh_runtime.py",
              "skills/zero-trust-delivery/SKILL.md",
              "policies/model-routing.yaml",
              "schemas/change-contract.schema.json",
              "tests",
          )
          for relative_path in required_paths:
              if not (destination / relative_path).exists():
                  raise SystemExit(f"required source path is missing: {relative_path}")
          if (destination / "VERSION").read_text(encoding="utf-8").strip() != "4.2.0":
              raise SystemExit("unexpected VERSION value")
          PY

      - name: Publish exact verified source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$RUNNER_TEMP/source/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          ACTUAL_TREE="$(git write-tree)"
          test "$ACTUAL_TREE" = "$EXPECTED_GIT_TREE" || {
            echo "final Git tree mismatch: actual=$ACTUAL_TREE expected=$EXPECTED_GIT_TREE" >&2
            exit 1
          }
          git diff --cached --quiet && {
            echo "materialization produced no changes" >&2
            exit 1
          }
          git commit -m "release: publish ZTAD Mesh 4.2.0 verified source"
          git push origin HEAD:main
