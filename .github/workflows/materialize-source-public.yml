name: Materialize validated ZTAD Mesh source (public handoff)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-source-public.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ztad-source-materialization
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout bootstrap revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download and verify validated source archive
        shell: bash
        env:
          SOURCE_FILE_ID: 1CxeZuC9PcV-1R3nlWyz55jlvY0hzjBaK
          SOURCE_SHA256: 23bb0357a0900a0c4dfa1110da1d5d08c0f8aa5cae95622e55b06a124a3a272c
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ztad-source.tar.xz"
          curl --fail --location --silent --show-error --retry 3 \
            "https://drive.usercontent.google.com/download?id=${SOURCE_FILE_ID}&export=download&confirm=t" \
            --output "$archive"
          echo "${SOURCE_SHA256}  ${archive}" | sha256sum --check --strict
          python - "$archive" "$RUNNER_TEMP/extracted" <<'PY'
          from pathlib import Path, PurePosixPath
          import os, sys, tarfile

          archive = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          destination.mkdir(parents=True, exist_ok=False)
          with tarfile.open(archive, "r:xz") as bundle:
              members = bundle.getmembers()
              if len(members) != 253:
                  raise SystemExit(f"unexpected member count: {len(members)}")
              total = 0
              for member in members:
                  name = member.name[2:] if member.name.startswith("./") else member.name
                  path = PurePosixPath(name)
                  if not name or path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  if not member.isfile() or member.issym() or member.islnk():
                      raise SystemExit(f"unsupported archive member: {member.name}")
                  target = (destination / Path(*path.parts)).resolve()
                  if os.path.commonpath([str(destination.resolve()), str(target)]) != str(destination.resolve()):
                      raise SystemExit(f"archive escape: {member.name}")
                  total += member.size
                  if total > 2_000_000:
                      raise SystemExit("archive exceeds expected uncompressed bound")
              if total != 1_255_479:
                  raise SystemExit(f"unexpected uncompressed size: {total}")
              for member in members:
                  name = member.name[2:] if member.name.startswith("./") else member.name
                  target = destination / Path(*PurePosixPath(name).parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"cannot read archive member: {member.name}")
                  target.write_bytes(source.read())
                  target.chmod(member.mode & 0o777)
          PY

      - name: Replace bootstrap tree with validated source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$RUNNER_TEMP/extracted/." .
          test "$(cat VERSION)" = "4.2.0"
          test -f .codex-plugin/plugin.json
          test -f scripts/ztad.py
          test -f toolkit/ztad/mesh_runtime.py

      - name: Commit complete source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No materialization changes found"; exit 1; }
          git commit -m "feat: publish ZTAD Mesh 4.2.0 validated source"
          git push origin HEAD:main
