name: Materialize exact ZTAD Mesh source from current main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-current-main.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: ztad-materialize-current-main-4-2-0
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_B64_LENGTH: "315912"
      EXPECTED_B64_SHA256: c0df972370ca99d728b23b982572d7479f2788e3231c681f7ae24a6d9f9542d4
      EXPECTED_ARCHIVE_BYTES: "236932"
      EXPECTED_ARCHIVE_SHA256: 23bb0357a0900a0c4dfa1110da1d5d08c0f8aa5cae95622e55b06a124a3a272c
      EXPECTED_FILE_COUNT: "253"
      EXPECTED_UNCOMPRESSED_BYTES: "1255479"
      EXPECTED_GIT_TREE: 1f168ae648eccb935ccd54c6f0d6f644d24dd095

    steps:
      - name: Check out the live main branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Extract the already-reviewed canonical materializer scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/materialize-complete.yml')
          text = workflow.read_text(encoding='utf-8')

          def extract(step_name: str) -> str:
              step_marker = f'      - name: {step_name}\n'
              step_start = text.find(step_marker)
              if step_start < 0:
                  raise SystemExit(f'canonical step not found: {step_name}')
              run_marker = '        run: |\n'
              run_start = text.find(run_marker, step_start)
              if run_start < 0:
                  raise SystemExit(f'run block not found: {step_name}')
              body_start = run_start + len(run_marker)
              next_step = text.find('\n      - name:', body_start)
              body_end = len(text) if next_step < 0 else next_step + 1
              lines = text[body_start:body_end].splitlines(keepends=True)
              output = []
              for line in lines:
                  if line.startswith('          '):
                      output.append(line[10:])
                  elif not line.strip():
                      output.append('\n')
                  else:
                      raise SystemExit(f'unexpected indentation in {step_name}: {line!r}')
              script = ''.join(output)
              if not script.startswith('set -Eeuo pipefail'):
                  raise SystemExit(f'unexpected canonical script prefix: {step_name}')
              return script

          scripts = {
              'reconstruct.sh': extract('Reconstruct, verify, and safely extract source'),
              'publish.sh': extract('Replace temporary tree with exact verified source'),
          }
          runner_temp = Path(__import__('os').environ['RUNNER_TEMP'])
          for filename, script in scripts.items():
              target = runner_temp / filename
              target.write_text(script, encoding='utf-8', newline='\n')
              target.chmod(0o700)
          PY

      - name: Reconstruct and verify the exact archive
        shell: bash
        run: bash "$RUNNER_TEMP/reconstruct.sh"

      - name: Publish the exact verified source as a fast-forward commit
        shell: bash
        run: bash "$RUNNER_TEMP/publish.sh"
