name: Diagnose part 3 repair subchunks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-part3-subchunks.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          ids=[5239750724,5239756100,5239761472,5239766610]
          repo=os.environ['GITHUB_REPOSITORY']
          for comment_id in ids:
              item=json.loads(subprocess.run(['gh','api',f'repos/{repo}/issues/comments/{comment_id}'],check=True,capture_output=True,text=True).stdout)
              header,sep,raw=item['body'].partition('\n')
              payload=''.join(raw.split())
              print(f'comment={comment_id} header={header} length={len(payload)} sha256={hashlib.sha256(payload.encode("ascii")).hexdigest()}')
              for block in range(10):
                  data=payload[block*100:(block+1)*100]
                  print(f'comment={comment_id} block={block} length={len(data)} sha256={hashlib.sha256(data.encode("ascii")).hexdigest()}')
          PY
