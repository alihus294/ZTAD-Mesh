name: Diagnose source transport segment

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-transport.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect exact segment comment
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/issues/comments/5238162912" > "$RUNNER_TEMP/comment.json"
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          item = json.loads((Path(os.environ['RUNNER_TEMP']) / 'comment.json').read_text(encoding='utf-8'))
          body = item['body']
          header, separator, raw = body.partition('\n')
          payload = ''.join(raw.split())
          print('issue_url=' + str(item.get('issue_url')))
          print('author=' + str((item.get('user') or {}).get('login')))
          print('header=' + header)
          print('has_separator=' + str(bool(separator)).lower())
          print('raw_length=' + str(len(raw)))
          print('normalized_length=' + str(len(payload)))
          print('normalized_sha256=' + hashlib.sha256(payload.encode('ascii')).hexdigest())
          print('whitespace_removed=' + str(len(raw) - len(payload)))
          PY
