name: Assemble verified ZTAD source part 5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/assemble-part5.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: ztad-assemble-source-part-5
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch owner-authored transport comments
        shell: bash
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/2/comments?per_page=100" > "$RUNNER_TEMP/comments.json"

      - name: Assemble and publish verified part 5
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re

          expected = {
              0: (16000, "3a237c823fe35b48d6668b875385bf172b0374a6772ed6f10b799b02a48de125"),
              1: (16000, "469b22f6c511e58c1a277abe809db32e8c7e9ad363b85a1e59e3ebdaee6e2401"),
              2: (16000, "1bd1fdbe8282cd14bc630ea4ea71a63959a79953c08588d7b370975a68bf5fe8"),
              3: (4000, "229e06e8b0eafeb1ed3b693c05ba98e5873181eeb2c8c3fd947a0ba05414ba6d"),
          }
          full_length = 52000
          full_hash = "b5fc690297177937a3aa81931390fbdfebbe39e9fabea3e3f8facbf68e801626"
          segment_re = re.compile(r"ZTAD_SOURCE_PART5_SEGMENT ([0-3]) ([0-9]+) ([0-9a-f]{64})")
          direct_header = f"ZTAD_SOURCE_PART 5 {full_length} {full_hash}"

          root = Path(os.environ["RUNNER_TEMP"])
          comments = json.loads((root / "comments.json").read_text(encoding="utf-8"))
          if not isinstance(comments, list):
              raise SystemExit("unexpected comments response")

          segments = {}
          direct_valid = False
          for item in comments:
              if not isinstance(item, dict) or (item.get("user") or {}).get("login") != "alihus294":
                  continue
              body = item.get("body")
              if not isinstance(body, str):
                  continue
              header, separator, payload = body.partition("\n")
              if not separator:
                  continue
              payload = payload.rstrip("\r\n")
              if any(character.isspace() for character in payload):
                  continue
              digest = hashlib.sha256(payload.encode("ascii")).hexdigest()

              if header.strip() == direct_header and len(payload) == full_length and digest == full_hash:
                  direct_valid = True
                  continue

              match = segment_re.fullmatch(header.strip())
              if not match:
                  continue
              index = int(match.group(1))
              expected_length, expected_hash = expected[index]
              if (int(match.group(2)), match.group(3), len(payload), digest) != (
                  expected_length, expected_hash, expected_length, expected_hash
              ):
                  continue
              if index in segments and segments[index] != payload:
                  raise SystemExit(f"conflicting valid part-5 segment {index}")
              segments[index] = payload

          if set(segments) != set(expected):
              raise SystemExit(f"missing valid part-5 segments: {sorted(set(expected) - set(segments))}")
          assembled = "".join(segments[index] for index in range(4))
          if len(assembled) != full_length or hashlib.sha256(assembled.encode("ascii")).hexdigest() != full_hash:
              raise SystemExit("assembled part 5 integrity mismatch")

          if direct_valid:
              (root / "direct-part5-exists").write_text("yes\n", encoding="utf-8")
          else:
              (root / "part5-comment.json").write_text(
                  json.dumps({"body": direct_header + "\n" + assembled}),
                  encoding="utf-8",
              )
          PY

          if [[ ! -f "$RUNNER_TEMP/direct-part5-exists" ]]; then
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/2/comments" --input "$RUNNER_TEMP/part5-comment.json" >/dev/null
          fi

      - name: Dispatch verified source materializer
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/materialize-verified.yml/dispatches" -f ref=main
