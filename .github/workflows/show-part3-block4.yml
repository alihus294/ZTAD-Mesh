name: Show stored part 3 block 4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/show-part3-block4.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  show:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import json, os, subprocess
          for comment_id, start in [(5239750724, 400), (5239793757, 0)]:
              item=json.loads(subprocess.run(['gh','api',f'repos/{os.environ["GITHUB_REPOSITORY"]}/issues/comments/{comment_id}'],check=True,capture_output=True,text=True).stdout)
              _,_,raw=item['body'].partition('\n')
              payload=''.join(raw.split())
              block=payload[start:start+100]
              print(f'comment={comment_id} block={block}')
              print(f'comment={comment_id} ords={list(map(ord, block))}')
          PY
