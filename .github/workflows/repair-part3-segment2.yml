name: Repair exact part 3 segment 2 payload

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-part3-segment2.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate repair subchunks and patch canonical comment
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re
          import subprocess
          import tempfile

          repository = os.environ['GITHUB_REPOSITORY']
          source_ids = [5239750724, 5239756100, 5239761472, 5239766610]
          expected_subhashes = {
              0: 'edad01db8143b3a65903d521a5ab8ed504d8a58e434066135b22cd3477189f11',
              1: '48c364201ac2dc51ecbb18f09215dc96c33ef683c7faf4846787f2e1f1ae320b',
              2: '9980d4d35455ee05b3a0925d0b7ef4bd11625d43727ecb524d71f0ef434796bf',
              3: '7efad77f3552e96e13773c5494d306e5f5156507e4d2b2c0e0f71bb9862b82f1',
          }
          pattern = re.compile(r'ZTAD_SOURCE_PART3_SEGMENT2_SUBCHUNK ([0-3]) 1000 ([0-9a-f]{64})')
          chunks = {}
          for comment_id in source_ids:
              raw = subprocess.run(
                  ['gh', 'api', f'repos/{repository}/issues/comments/{comment_id}'],
                  check=True, capture_output=True, text=True,
              )
              item = json.loads(raw.stdout)
              header, separator, body = item['body'].partition('\n')
              if not separator:
                  raise SystemExit(f'missing separator in comment {comment_id}')
              match = pattern.fullmatch(header.strip())
              if not match:
                  raise SystemExit(f'invalid header in comment {comment_id}: {header}')
              index = int(match.group(1))
              payload = ''.join(body.split())
              digest = hashlib.sha256(payload.encode('ascii')).hexdigest()
              if len(payload) != 1000 or match.group(2) != expected_subhashes[index] or digest != expected_subhashes[index]:
                  raise SystemExit(f'invalid repair subchunk {index}: length={len(payload)} hash={digest}')
              if index in chunks and chunks[index] != payload:
                  raise SystemExit(f'conflicting repair subchunk {index}')
              chunks[index] = payload

          if set(chunks) != set(expected_subhashes):
              raise SystemExit(f'missing repair subchunks: {sorted(set(expected_subhashes)-set(chunks))}')
          repair = ''.join(chunks[index] for index in range(4))
          repair_hash = hashlib.sha256(repair.encode('ascii')).hexdigest()
          if repair_hash != 'd92ed531cf2de984f1b68f9de463192274a6864dd234a3fe8ca38f2c6cb37828':
              raise SystemExit(f'repair chunk hash mismatch: {repair_hash}')

          target_id = 5239661959
          target_raw = subprocess.run(
              ['gh', 'api', f'repos/{repository}/issues/comments/{target_id}'],
              check=True, capture_output=True, text=True,
          )
          target = json.loads(target_raw.stdout)
          _, separator, target_body = target['body'].partition('\n')
          if not separator:
              raise SystemExit('target comment has no payload')
          payload = ''.join(target_body.split())
          if len(payload) != 16000:
              raise SystemExit(f'target length mismatch: {len(payload)}')
          expected_unchanged = {
              0: '7cf544ad9f8aa0e8a50d0507fb528ef79c779dc4bad02ed83bb15819162de05b',
              1: '71e88dec3421b3cad8c3c75a2246d5e2dd7c65290c2c3e684858124b4784a6a4',
              3: '0d520e1813af686c7abc1cb37338a73c557ea27f4c5eb70e93e84da62181468a',
          }
          for index, expected_hash in expected_unchanged.items():
              chunk = payload[index*4000:(index+1)*4000]
              digest = hashlib.sha256(chunk.encode('ascii')).hexdigest()
              if digest != expected_hash:
                  raise SystemExit(f'target unchanged chunk {index} mismatch: {digest}')

          repaired = payload[:8000] + repair + payload[12000:]
          final_hash = hashlib.sha256(repaired.encode('ascii')).hexdigest()
          expected_final = '564056cec9ea558b6dcdb20219594dad6e98b3d84537553b703030cbc73c4086'
          if len(repaired) != 16000 or final_hash != expected_final:
              raise SystemExit(f'repaired payload mismatch: length={len(repaired)} hash={final_hash}')

          request = {
              'body': f'ZTAD_SOURCE_PART3_SEGMENT 2 16000 {expected_final}\n{repaired}'
          }
          with tempfile.NamedTemporaryFile('w', encoding='utf-8', delete=False) as stream:
              json.dump(request, stream, separators=(',', ':'))
              request_path = stream.name
          subprocess.run(
              ['gh', 'api', '--method', 'PATCH', f'repos/{repository}/issues/comments/{target_id}', '--input', request_path],
              check=True,
          )
          Path(request_path).unlink(missing_ok=True)
          print(json.dumps({'target_comment': target_id, 'length': len(repaired), 'sha256': final_hash}, sort_keys=True))
          PY
