name: Final ZTAD Mesh 4.2.0 publication audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/final-publication-audit.yml

permissions:
  contents: write
  issues: write

env:
  PYTHONDONTWRITEBYTECODE: "1"
  EXPECTED_TREE: 1f168ae648eccb935ccd54c6f0d6f644d24dd095

jobs:
  identify:
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Bind audit to exact parent source commit
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_SHA='${{ github.event.before }}'
          test -n "$SOURCE_SHA"
          test "$SOURCE_SHA" != '0000000000000000000000000000000000000000'
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  validate:
    needs: identify
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identify.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact Git tree
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test "$(cat VERSION)" = "4.2.0"
          test ! -e .bootstrap
          test -f .github/workflows/ci.yml
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            toolkit/requirements.lock.txt
            toolkit/requirements-dev.lock.txt
      - name: Install exact test environment
        run: python -m pip install --disable-pip-version-check -r toolkit/requirements-dev.lock.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q toolkit scripts evals tests
      - name: Run unit and integration tests
        env:
          PYTHONPATH: toolkit
        run: python -B -m pytest -q
      - name: Run offline functional and adversarial evals
        run: python -B evals/run_evals.py --output "${{ runner.temp }}/eval-summary.json"
      - name: Validate bundle
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/bundle-validation.json" validate-bundle --root .
      - name: Verify policy wiring
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/policy-wiring.json" policy-wiring --root .

  distribution:
    needs: identify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.identify.outputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source tree
        shell: bash
        run: test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolkit/requirements-dev.lock.txt
      - run: python -m pip install --disable-pip-version-check -r toolkit/requirements-dev.lock.txt
      - name: Set deterministic timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build deterministic distribution A
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/dist-a.json" build-distribution --root . --output-dir "${{ runner.temp }}/dist-a"
      - name: Build deterministic distribution B
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/dist-b.json" build-distribution --root . --output-dir "${{ runner.temp }}/dist-b"
      - name: Compare complete build trees
        shell: bash
        run: diff -qr "${{ runner.temp }}/dist-a" "${{ runner.temp }}/dist-b"
      - name: Validate Plugin archive
        run: python -B scripts/ztad.py validate-distribution --archive "${{ runner.temp }}/dist-a/zero-trust-agentic-delivery-plugin-4.2.0.zip" --kind plugin
      - name: Validate Marketplace archive
        run: python -B scripts/ztad.py validate-distribution --archive "${{ runner.temp }}/dist-a/zero-trust-agentic-delivery-marketplace-4.2.0.zip" --kind marketplace

  finalize:
    needs: [identify, validate, distribution]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out temporary audit commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Remove one-time audit and restore exact source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/final-publication-audit.yml
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git commit -m "chore: finalize exact ZTAD Mesh 4.2.0 source tree"
          git push origin HEAD:main
      - name: Record final verified publication
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/2/comments" -f body="ZTAD_FINAL_PUBLICATION_PASS source=${{ needs.identify.outputs.source_sha }} tree=${EXPECTED_TREE} matrix=linux+windows/python3.11+3.13 distribution=reproducible"
