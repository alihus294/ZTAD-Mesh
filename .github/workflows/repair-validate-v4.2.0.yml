name: Repair and validate ZTAD Mesh 4.2.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-validate-v4.2.0.yml
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: ztad-repair-validate-v4-2-0
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.publish.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_B64_LENGTH: "315912"
      EXPECTED_B64_SHA256: c0df972370ca99d728b23b982572d7479f2788e3231c681f7ae24a6d9f9542d4
      EXPECTED_ARCHIVE_BYTES: "236932"
      EXPECTED_ARCHIVE_SHA256: 23bb0357a0900a0c4dfa1110da1d5d08c0f8aa5cae95622e55b06a124a3a272c
      EXPECTED_FILE_COUNT: "253"
      EXPECTED_UNCOMPRESSED_BYTES: "1255479"
      EXPECTED_GIT_TREE: 1f168ae648eccb935ccd54c6f0d6f644d24dd095

    steps:
      - name: Check out current revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and safely extract exact source
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, json, os, re, subprocess, tarfile, unicodedata

          expected_p0 = {
              0: (8000, "9748296b3cdfd30afbc88e534a68c1c496fb70e376c783fe1ddb4e713b1a49f3"),
              1: (8000, "2c179cc0a8ef56c8e9785b73294d92127ebd5c6321564b7b1241295047c98735"),
              2: (8000, "5f4dab8c35cd74ec6721098fa62d8bbf3bbb8d7dd33a8fe02256f5d014d9868d"),
              3: (8000, "d148076270bb1d2e3c5aba7e4eff741160c14c010567d33f397e214f09f6f221"),
              4: (8000, "71e4dc574c04e2b94557aba302da0bf4a60637872e2909c9229f585fec9b848d"),
              5: (8000, "935a7012b0faa4d9a9ea98a2222365e96833b8906c1f913d4b13ff618e0027df"),
              6: (4000, "a0b262dbe64ceaca26fd17f10a34a884a8fd586bc15c1837d319bb446359e8fd"),
          }
          expected_segments = {
              1: {0:(16000,"2b73fdcf812c511404ccd01ae5e7bbad87781f5695c964bd52b46b31ed20edf0"),1:(16000,"2e3720f3b88132e1e9368b37d45a5307cefc0eda82c32ceeac5d8d0c906f6014"),2:(16000,"9212fb924c0e7759cf43b773184b6d5cd0c6d30374e0c52035c870ba6d044d1d"),3:(4000,"cbfcd8e4b385d833b2ca994d4d2c59ed863b09fbb085af9bf12821930ddda5db")},
              2: {0:(16000,"53e2625c3af3e5bb6ab9ac24443178e52ff876760f161c08a0916b1968df4956"),1:(16000,"7bc11521de39c1344e8f8c36052669b832b9cea821417465b802f3cde99e42fb"),2:(16000,"4fed85fad0aca65fec22c0bb50aae3f3bb0960c4da251c82b7a7a904b939c1f9"),3:(4000,"abf942ec5a75da10351475fd5be966afab0fbd8c01f32fb584f79f902f7d47c3")},
              3: {0:(16000,"e7c4a0c0f62211235de87fbeec7369ede244e5a2b4a890659cdff1f633199fb0"),1:(16000,"6d94b2ad7b83b213b58bf969bd76fd21ecda8ae5315995996a009a1ac1f11462"),2:(16000,"564056cec9ea558b6dcdb20219594dad6e98b3d84537553b703030cbc73c4086"),3:(4000,"b0e19b462c8c140f5290e04711b0aed5dc0f23a0bfb32599aa34edc40470edb1")},
              4: {0:(16000,"2304583bc2f7394acfb5ac0e0ffbf878afb623ba51747fb3fd40864f5e75f4ca"),1:(16000,"27912ed84e19cefa2d07f2429f38c9b88abe4a07b0a2ce343835a9d02df42090"),2:(16000,"94df9d65dccba759c39ee410da43142533ae4488b65757681231940182245e16"),3:(4000,"bdede308357a5b06d28fc9a3da3f1da85900e0b714da1cfdd0274956a454b6d6")},
              5: {0:(16000,"3a237c823fe35b48d6668b875385bf172b0374a6772ed6f10b799b02a48de125"),1:(16000,"469b22f6c511e58c1a277abe809db32e8c7e9ad363b85a1e59e3ebdaee6e2401"),2:(16000,"1bd1fdbe8282cd14bc630ea4ea71a63959a79953c08588d7b370975a68bf5fe8"),3:(4000,"229e06e8b0eafeb1ed3b693c05ba98e5873181eeb2c8c3fd947a0ba05414ba6d")},
          }
          part_hashes = {
              0:"dbe4040858965328ded64b964477a3fe7f721f8370f35ca1e3951a684fbe9570",
              1:"cb05798729cf6f0dbbcdcd5e8d4de5ee9c36ece394b99adcea3075c4366300ea",
              2:"e84b7f91815dc58c54637af3c926081af77d86e200ccc510899aa58d73828fe9",
              3:"e2b07c2d55a4151714b10335a4c4fd96308c9a1f0590fc686c8ea65b406e162d",
              4:"6ad4f2c680e10ca75185a05376d805a5994ae6936882f8400af6d6810ccc09b8",
              5:"b5fc690297177937a3aa81931390fbdfebbe39e9fabea3e3f8facbf68e801626",
              6:"ece567743ac650259d983c72c44666a1eccd8e8461ccf283a251801a59fa199a",
          }
          p0_re = re.compile(r"ZTAD_SOURCE_PART0_SEGMENT ([0-6]) ([0-9]+) ([0-9a-f]{64})")
          seg_re = re.compile(r"ZTAD_SOURCE_PART([1-5])_SEGMENT ([0-3]) ([0-9]+) ([0-9a-f]{64})")
          p6_re = re.compile(r"ZTAD_SOURCE_PART 6 ([0-9]+) ([0-9a-f]{64})")

          comments=[]
          for page_no in range(1,100):
              result=subprocess.run(["gh","api",f"repos/{os.environ['GITHUB_REPOSITORY']}/issues/2/comments?per_page=100&page={page_no}"],check=True,capture_output=True,text=True)
              page=json.loads(result.stdout)
              if not isinstance(page,list): raise SystemExit("unexpected comments response")
              comments.extend(page)
              if len(page)<100: break
          else: raise SystemExit("comment pagination exceeded safety bound")

          p0={}; segments={part:{} for part in expected_segments}; p6=None
          def store(container,key,payload,label):
              old=container.get(key)
              if old is not None and old!=payload: raise SystemExit(f"conflicting {label}")
              container[key]=payload
          for comment in comments:
              if (comment.get("user") or {}).get("login")!="alihus294": continue
              body=comment.get("body")
              if not isinstance(body,str): continue
              header,sep,raw=body.partition("\n")
              if not sep: continue
              payload="".join(raw.split())
              match=p0_re.fullmatch(header.strip())
              if match:
                  idx=int(match.group(1)); length=int(match.group(2)); declared=match.group(3); exp_len,exp_hash=expected_p0[idx]
                  actual=hashlib.sha256(payload.encode("ascii")).hexdigest()
                  if length==exp_len and declared==exp_hash and len(payload)==exp_len and actual==exp_hash: store(p0,idx,payload,f"part0 segment {idx}")
                  continue
              match=seg_re.fullmatch(header.strip())
              if match:
                  part=int(match.group(1)); idx=int(match.group(2)); length=int(match.group(3)); declared=match.group(4); exp_len,exp_hash=expected_segments[part][idx]
                  actual=hashlib.sha256(payload.encode("ascii")).hexdigest()
                  if length==exp_len and declared==exp_hash and len(payload)==exp_len and actual==exp_hash: store(segments[part],idx,payload,f"part {part} segment {idx}")
                  continue
              match=p6_re.fullmatch(header.strip())
              if match:
                  actual=hashlib.sha256(payload.encode("ascii")).hexdigest()
                  if int(match.group(1))==3912 and match.group(2)==part_hashes[6] and len(payload)==3912 and actual==part_hashes[6]:
                      if p6 is not None and p6!=payload: raise SystemExit("conflicting part 6")
                      p6=payload

          if set(p0)!=set(expected_p0): raise SystemExit(f"missing part0 segments {sorted(set(expected_p0)-set(p0))}")
          parts={0:"".join(p0[i] for i in range(7))}
          for part,spec in expected_segments.items():
              if set(segments[part])!=set(spec): raise SystemExit(f"missing part {part} segments {sorted(set(spec)-set(segments[part]))}")
              parts[part]="".join(segments[part][i] for i in range(4))
          if p6 is None: raise SystemExit("missing part 6")
          parts[6]=p6
          for part,payload in parts.items():
              exp_len=3912 if part==6 else 52000
              if len(payload)!=exp_len: raise SystemExit(f"part {part} length mismatch")
              if hashlib.sha256(payload.encode("ascii")).hexdigest()!=part_hashes[part]: raise SystemExit(f"part {part} hash mismatch")
          encoded="".join(parts[i] for i in range(7))
          if len(encoded)!=int(os.environ["EXPECTED_B64_LENGTH"]): raise SystemExit("base64 length mismatch")
          if hashlib.sha256(encoded.encode("ascii")).hexdigest()!=os.environ["EXPECTED_B64_SHA256"]: raise SystemExit("base64 hash mismatch")
          archive=base64.b64decode(encoded,validate=True)
          if len(archive)!=int(os.environ["EXPECTED_ARCHIVE_BYTES"]): raise SystemExit("archive length mismatch")
          if hashlib.sha256(archive).hexdigest()!=os.environ["EXPECTED_ARCHIVE_SHA256"]: raise SystemExit("archive hash mismatch")

          destination=Path(os.environ["RUNNER_TEMP"])/"ztad-source"; destination.mkdir()
          resolved=destination.resolve(); exact=set(); folded=set(); total=0
          with tarfile.open(fileobj=io.BytesIO(archive),mode="r:xz") as bundle:
              members=bundle.getmembers()
              if len(members)!=int(os.environ["EXPECTED_FILE_COUNT"]): raise SystemExit(f"member count mismatch {len(members)}")
              validated=[]
              for member in members:
                  raw=member.name[2:] if member.name.startswith("./") else member.name
                  normalized=unicodedata.normalize("NFC",raw); path=PurePosixPath(normalized)
                  if not normalized or path.is_absolute() or "." in path.parts or ".." in path.parts or "\\" in normalized or ":" in path.parts[0]: raise SystemExit(f"unsafe path {member.name}")
                  if not member.isfile() or member.issym() or member.islnk(): raise SystemExit(f"unsupported member {member.name}")
                  key=path.as_posix(); fold=key.casefold()
                  if key in exact or fold in folded: raise SystemExit(f"duplicate path {member.name}")
                  exact.add(key); folded.add(fold); target=(destination/Path(*path.parts)).resolve()
                  if os.path.commonpath([str(resolved),str(target)])!=str(resolved): raise SystemExit(f"escaping path {member.name}")
                  total+=member.size
                  if member.size>16_000_000 or total>2_000_000: raise SystemExit("extraction bound exceeded")
                  validated.append((member,target))
              if total!=int(os.environ["EXPECTED_UNCOMPRESSED_BYTES"]): raise SystemExit(f"uncompressed bytes mismatch {total}")
              for member,target in validated:
                  target.parent.mkdir(parents=True,exist_ok=True); stream=bundle.extractfile(member)
                  if stream is None: raise SystemExit(f"cannot read {member.name}")
                  data=stream.read()
                  if len(data)!=member.size: raise SystemExit(f"short read {member.name}")
                  target.write_bytes(data); target.chmod(member.mode & 0o777)
          for rel in ["VERSION",".codex-plugin/plugin.json",".github/workflows/ci.yml","hooks/hooks.json","scripts/ztad.py","toolkit/ztad/mesh_runtime.py","skills/zero-trust-delivery/SKILL.md","policies/model-routing.yaml","schemas/change-contract.schema.json","tests"]:
              if not (destination/rel).exists(): raise SystemExit(f"missing required path {rel}")
          if (destination/"VERSION").read_text(encoding="utf-8").strip()!="4.2.0": raise SystemExit("VERSION mismatch")
          print(json.dumps({"comments":len(comments),"files":len(exact),"bytes":total},sort_keys=True))
          PY

      - name: Publish exact source commit
        id: publish
        shell: bash
        run: |
          set -Eeuo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$RUNNER_TEMP/ztad-source/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          ACTUAL_TREE="$(git write-tree)"
          test "$ACTUAL_TREE" = "$EXPECTED_GIT_TREE" || { echo "tree mismatch actual=$ACTUAL_TREE expected=$EXPECTED_GIT_TREE" >&2; exit 1; }
          if git diff --cached --quiet; then
            SHA="$(git rev-parse HEAD)"
          else
            git commit -m "release: publish ZTAD Mesh 4.2.0 exact verified source"
            git push origin HEAD:main
            SHA="$(git rev-parse HEAD)"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Published SHA: $SHA"

  test:
    needs: materialize
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.materialize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            toolkit/requirements.lock.txt
            toolkit/requirements-dev.lock.txt
      - name: Install exact test environment
        run: python -m pip install --disable-pip-version-check -r toolkit/requirements-dev.lock.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile source
        run: python -m compileall -q toolkit scripts evals tests
      - name: Run tests
        env:
          PYTHONPATH: toolkit
        run: python -B -m pytest -q
      - name: Run offline evals
        run: python -B evals/run_evals.py --output "${{ runner.temp }}/eval-summary.json"
      - name: Validate bundle
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/bundle-validation.json" validate-bundle --root .
      - name: Verify policy wiring
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/policy-wiring.json" policy-wiring --root .

  distribution:
    needs: materialize
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.materialize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolkit/requirements-dev.lock.txt
      - run: python -m pip install --disable-pip-version-check -r toolkit/requirements-dev.lock.txt
      - name: Set deterministic timestamp
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - name: Build distribution A
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/dist-a.json" build-distribution --root . --output-dir "${{ runner.temp }}/dist-a"
      - name: Build distribution B
        run: python -B scripts/ztad.py --output "${{ runner.temp }}/dist-b.json" build-distribution --root . --output-dir "${{ runner.temp }}/dist-b"
      - name: Compare deterministic builds
        shell: bash
        run: diff -qr "${{ runner.temp }}/dist-a" "${{ runner.temp }}/dist-b"
      - name: Validate Plugin archive
        run: python -B scripts/ztad.py validate-distribution --archive "${{ runner.temp }}/dist-a/zero-trust-agentic-delivery-plugin-4.2.0.zip" --kind plugin
      - name: Validate Marketplace archive
        run: python -B scripts/ztad.py validate-distribution --archive "${{ runner.temp }}/dist-a/zero-trust-agentic-delivery-marketplace-4.2.0.zip" --kind marketplace

  complete:
    needs: [materialize, test, distribution]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require every validation job
        shell: bash
        run: |
          test "${{ needs.materialize.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.distribution.result }}" = success
      - name: Record verified success
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/2/comments" -f body="ZTAD_VALIDATION_SUCCESS ${{ needs.materialize.outputs.sha }} Linux+Windows Python3.11+3.13 tests/evals/bundle/policy/distribution PASS"
