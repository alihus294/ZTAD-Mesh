name: v4.3 Final Validation

on:
  push:
    branches:
      - feat/v4.3.0-guarded-fast-path

permissions:
  contents: read

concurrency:
  group: v430-final-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: toolkit/requirements-dev.lock.txt

      - name: Install exact locked environment
        run: python -m pip install --disable-pip-version-check -r toolkit/requirements-dev.lock.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile every Python surface
        run: python -m compileall -q toolkit scripts evals tests validation

      - name: Run complete unit and integration suite
        env:
          PYTHONPATH: toolkit
        run: python -B -m pytest -q

      - name: Run offline functional and adversarial evals
        run: python -B evals/run_evals.py --output "${{ runner.temp }}/eval-summary.json"

      - name: Validate bundle and deterministic policy wiring
        run: |
          python -B scripts/ztad.py --output "${{ runner.temp }}/bundle.json" validate-bundle --root .
          python -B scripts/ztad.py --output "${{ runner.temp }}/policy.json" policy-wiring --root .

      - name: Stress critical v4.3 control paths five times
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        env:
          PYTHONPATH: toolkit
        run: |
          for i in 1 2 3 4 5; do
            echo "critical v4.3 iteration $i"
            python -B -m pytest -q \
              tests/test_v43_last_gaps.py \
              tests/test_v43_final_hardening.py \
              tests/test_v43_runtime_controls.py \
              tests/test_v43_guarded_fast_path.py
          done

      - name: Run branch-aware coverage pass
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        env:
          PYTHONPATH: toolkit
        run: python -B -m pytest -q --cov=toolkit/ztad --cov-branch --cov-report=term-missing

      - name: Run 43k fuzz and process-concurrency validation
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -B validation/run_v42_external_validation.py

      - name: Run selected critical mutation suite
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: python -B validation/run_v42_mutations.py

      - name: Restore validation outputs generated by stress tools
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: |
          git restore -- validation/mutation-v42.json 2>/dev/null || true
          rm -f validation/external-validation-v42.json

      - name: Set reproducible build timestamp
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Build distribution twice
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -B scripts/ztad.py --output "${{ runner.temp }}/dist-a.json" build-distribution --root . --output-dir "${{ runner.temp }}/dist-a"
          python -B scripts/ztad.py --output "${{ runner.temp }}/dist-b.json" build-distribution --root . --output-dir "${{ runner.temp }}/dist-b"

      - name: Prove byte-identical deterministic distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        shell: bash
        run: diff -qr "${{ runner.temp }}/dist-a" "${{ runner.temp }}/dist-b"

      - name: Validate v4.3.0 Plugin and Marketplace archives
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: |
          python -B scripts/ztad.py validate-distribution --archive "${{ runner.temp }}/dist-a/zero-trust-agentic-delivery-plugin-4.3.0.zip" --kind plugin
          python -B scripts/ztad.py validate-distribution --archive "${{ runner.temp }}/dist-a/zero-trust-agentic-delivery-marketplace-4.3.0.zip" --kind marketplace

      - name: Prove source tree remained unchanged
        shell: bash
        run: |
          test -z "$(git status --porcelain=v1 --untracked-files=all)" || {
            git status --short
            exit 1
          }
