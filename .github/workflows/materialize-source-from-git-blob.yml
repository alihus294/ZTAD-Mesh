name: Materialize validated ZTAD Mesh 4.2.0 source from Git object

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/materialize-source-from-git-blob.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ztad-source-materialization-v420
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_ARCHIVE_SHA256: 23bb0357a0900a0c4dfa1110da1d5d08c0f8aa5cae95622e55b06a124a3a272c
      EXPECTED_MEMBER_COUNT: "253"
      EXPECTED_UNCOMPRESSED_BYTES: "1255479"
      EXPECTED_TREE_SHA: 1f168de330ade9c0b33827f747bec25e3707b6ec
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout bootstrap revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Recover exact archive from authenticated Git blobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import base64, hashlib, json, os, sys, urllib.error, urllib.request
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected = os.environ["EXPECTED_ARCHIVE_SHA256"]
          candidates = [
              "40dfef0bf69b24ae6543594cd9a02cff686190f4",
              "d2a64675f81d57071954f58b60d8d40feba518b3",
              "30d74d258442c7c65512eafab474568dd706c430",
              "b6fc4c620b67d95f953a5c1c1230aaab5db5a1b0",
              "333d6d1944ca3bbe52f4327d4d59e204482fff3e",
              "94ac027024b94b42fdaf0274f228de10a45e379c",
              "26ed4a37af607e4c7b2cf3bec727973618add568",
              "30ea1d1f06056aee677a5ea0b7048bd38de8b70b",
              "825036de6ef5c19af9ca36072786b195f07e040d",
              "adb49fe40c483855414222615f86fa3ea78f2fe7",
              "39a7a373ba6e9f0498e5cfdf2cd33176d6b4f708",
              "391bb4929c512c9a16d5ec62ca17a96621101ec4",
              "7c4d9a9d92d09f3929df9194393fa8c5fd9cd5e2",
              "325e72d43965dbbd2ea577549554473ae11e7661",
              "ca22a4db53b454d4480d38b87f891077722d1ba4",
              "9319937f238e18db13618cf6c7a8bbe89ce1302d",
              "9a8e96c4c362d10e6962e37f05a5427bba0e9320",
              "11fc12ea26680864a3a1ddd1913e438492e29105",
              "644ca168f7ef42d8ef00cd6b34acb7a41c4e574f",
          ]
          destination = Path(os.environ["RUNNER_TEMP"]) / "ztad-source.tar.xz"
          selected = None
          observed = []
          for sha in candidates:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/blobs/{sha}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ztad-source-materializer",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.load(response)
              except urllib.error.HTTPError as exc:
                  observed.append({"sha": sha, "status": exc.code})
                  continue
              if payload.get("encoding") != "base64":
                  observed.append({"sha": sha, "status": "unsupported-encoding"})
                  continue
              raw = base64.b64decode(payload["content"], validate=False)
              digest = hashlib.sha256(raw).hexdigest()
              observed.append({"sha": sha, "bytes": len(raw), "sha256": digest})
              if digest == expected:
                  destination.write_bytes(raw)
                  selected = sha
                  break
          print(json.dumps({"selected": selected, "observed": observed}, indent=2))
          if selected is None:
              raise SystemExit("no Git blob matched the trusted source archive SHA-256")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"SELECTED_SOURCE_BLOB={selected}\n")
              env.write(f"SOURCE_ARCHIVE={destination}\n")
          PY
          echo "${EXPECTED_ARCHIVE_SHA256}  ${SOURCE_ARCHIVE}" | sha256sum --check --strict

      - name: Validate and safely extract source archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          from pathlib import Path, PurePosixPath
          import hashlib, json, os, stat, tarfile

          archive = Path(os.environ["SOURCE_ARCHIVE"])
          destination = Path(os.environ["RUNNER_TEMP"]) / "source"
          destination.mkdir(parents=True, exist_ok=False)
          expected_count = int(os.environ["EXPECTED_MEMBER_COUNT"])
          expected_total = int(os.environ["EXPECTED_UNCOMPRESSED_BYTES"])
          seen_casefold = set()
          count = 0
          total = 0
          manifest = []
          with tarfile.open(archive, "r:xz") as bundle:
              members = bundle.getmembers()
              if len(members) != expected_count:
                  raise SystemExit(f"unexpected member count: {len(members)}")
              for member in members:
                  raw_name = member.name[2:] if member.name.startswith("./") else member.name
                  path = PurePosixPath(raw_name)
                  if not raw_name or path.is_absolute() or "." in path.parts or ".." in path.parts:
                      raise SystemExit(f"unsafe archive path: {member.name}")
                  normalized = path.as_posix()
                  folded = normalized.casefold()
                  if folded in seen_casefold:
                      raise SystemExit(f"case-insensitive duplicate path: {normalized}")
                  seen_casefold.add(folded)
                  if not member.isfile() or member.issym() or member.islnk() or member.isdev() or member.isfifo():
                      raise SystemExit(f"unsupported archive member: {member.name}")
                  if member.size < 0 or member.size > 2_000_000:
                      raise SystemExit(f"invalid member size: {member.name}")
                  total += member.size
                  count += 1
                  if total > expected_total:
                      raise SystemExit("archive exceeds trusted uncompressed size")
                  target = (destination / Path(*path.parts)).resolve()
                  if os.path.commonpath([str(destination.resolve()), str(target)]) != str(destination.resolve()):
                      raise SystemExit(f"archive escape: {member.name}")
                  source = bundle.extractfile(member)
                  if source is None:
                      raise SystemExit(f"cannot read member: {member.name}")
                  data = source.read()
                  if len(data) != member.size:
                      raise SystemExit(f"short member read: {member.name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(0o755 if member.mode & stat.S_IXUSR else 0o644)
                  manifest.append({"path": normalized, "size": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          if count != expected_count or total != expected_total:
              raise SystemExit(f"inventory mismatch: count={count}, bytes={total}")
          (destination / "SOURCE_ARCHIVE_MANIFEST.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          # The generated audit manifest is evidence only, not part of the published tree.
          (destination / "SOURCE_ARCHIVE_MANIFEST.json").unlink()
          required = [
              "VERSION", "README.md", ".codex-plugin/plugin.json", "scripts/ztad.py",
              "toolkit/ztad/mesh_runtime.py", "tests", "skills", "policies", "schemas", "hooks"
          ]
          missing = [item for item in required if not (destination / item).exists()]
          if missing:
              raise SystemExit(f"required source paths missing: {missing}")
          if (destination / "VERSION").read_text(encoding="utf-8").strip() != "4.2.0":
              raise SystemExit("unexpected VERSION")
          print(json.dumps({"members": count, "bytes": total, "source": str(destination)}, indent=2))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"EXTRACTED_SOURCE={destination}\n")
          PY

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            'PyYAML==6.0.3' 'jsonschema==4.26.0' 'cryptography>=48.0.1,<51'

      - name: Run source test and governance gates
        shell: bash
        working-directory: ${{ env.EXTRACTED_SOURCE }}
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test*.py' -v
          python -B scripts/ztad.py validate-bundle --root .
          python -B scripts/ztad.py policy-wiring --root .
          find . -type d -name __pycache__ -prune -exec rm -rf -- {} +
          find . -type f \( -name '*.pyc' -o -name '.coverage*' \) -delete

      - name: Replace bootstrap tree and verify exact Git tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "${EXTRACTED_SOURCE}/." .
          git add -A
          git diff --cached --check
          actual_tree="$(git write-tree)"
          echo "Expected tree: ${EXPECTED_TREE_SHA}"
          echo "Actual tree:   ${actual_tree}"
          test "${actual_tree}" = "${EXPECTED_TREE_SHA}"
          echo "ACTUAL_TREE_SHA=${actual_tree}" >> "$GITHUB_ENV"

      - name: Publish complete validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && { echo "No source publication changes found"; exit 1; }
          git commit -m "release: publish ZTAD Mesh 4.2.0 validated source"
          git push origin HEAD:main
          echo "Published source blob ${SELECTED_SOURCE_BLOB} as tree ${ACTUAL_TREE_SHA}"
