name: Apply and verify CLI dispatch hotfix

on:
  push:
    branches: [fix/cli-dispatch-shadowing-4.2.1]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/cli-dispatch-shadowing-4.2.1
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            toolkit/pyproject.toml
            toolkit/requirements.lock.txt
            toolkit/requirements-dev.lock.txt

      - name: Apply deterministic source patch
        run: python -B scripts/apply_cli_hotfix_421.py

      - name: Install exact test environment
        run: python -m pip install --disable-pip-version-check -r toolkit/requirements-dev.lock.txt

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile all Python sources
        run: python -m compileall -q toolkit scripts evals tests validation

      - name: Reject whitespace and patch-format defects
        run: git diff --check

      - name: Run targeted CLI dispatch regressions first
        env:
          PYTHONPATH: toolkit
        run: python -B -m pytest -q tests/test_cli_dispatch_regression.py

      - name: Run full unit and integration suite
        env:
          PYTHONPATH: toolkit
        run: python -B -m pytest -q

      - name: Run branch-aware toolkit coverage
        env:
          PYTHONPATH: toolkit
        run: python -B -m pytest --cov=ztad --cov-branch --cov-report=term-missing --cov-fail-under=75 -q

      - name: Run offline functional and adversarial evals
        run: python -B evals/run_evals.py --output "${{ runner.temp }}/eval-summary.json"

      - name: Validate plugin bundle
        run: python -B scripts/ztad.py validate-bundle --root .

      - name: Verify policy wiring
        run: python -B scripts/ztad.py policy-wiring --root .

      - name: Smoke-test real audit and dry-run entry points
        shell: bash
        run: |
          for command in audit dry-run; do
            target="${{ runner.temp }}/${command}-target"
            mkdir -p "$target/.delivery/custom"
            printf 'user-owned\n' > "$target/README.md"
            printf 'keep\n' > "$target/.delivery/custom/keep.txt"
            before="$(find "$target" -type f -print0 | sort -z | xargs -0 sha256sum)"
            python -B scripts/ztad.py "$command" --repo "$target" > "${{ runner.temp }}/${command}.json"
            python -c 'import json,sys; p=json.load(open(sys.argv[1],encoding="utf-8")); assert p["repository_mutated"] is False; assert p["mode"]==sys.argv[2]' "${{ runner.temp }}/${command}.json" "$(echo "$command" | tr '[:lower:]-' '[:upper:]_')"
            after="$(find "$target" -type f -print0 | sort -z | xargs -0 sha256sum)"
            test "$before" = "$after"
          done

      - name: Run selected critical mutation suite
        run: |
          python -B validation/run_v42_mutations.py
          git checkout -- validation/mutation-v42.json

      - name: Run 43k fuzz and process-concurrency validation
        run: |
          python -B validation/run_v42_external_validation.py
          git checkout -- validation/external-validation-v42.json

      - name: Build deterministic distribution A
        env:
          SOURCE_DATE_EPOCH: "1786492800"
        run: python -B scripts/ztad.py build-distribution --root . --output-dir "${{ runner.temp }}/dist-a"

      - name: Build deterministic distribution B
        env:
          SOURCE_DATE_EPOCH: "1786492800"
        run: python -B scripts/ztad.py build-distribution --root . --output-dir "${{ runner.temp }}/dist-b"

      - name: Compare deterministic distribution trees byte-for-byte
        run: diff -qr "${{ runner.temp }}/dist-a" "${{ runner.temp }}/dist-b"

      - name: Validate rebuilt Plugin archive
        run: python -B scripts/ztad.py validate-distribution --archive "${{ runner.temp }}/dist-a/zero-trust-agentic-delivery-plugin-4.2.1.zip" --kind plugin

      - name: Validate rebuilt Marketplace archive
        run: python -B scripts/ztad.py validate-distribution --archive "${{ runner.temp }}/dist-a/zero-trust-agentic-delivery-marketplace-4.2.1.zip" --kind marketplace

      - name: Ensure generated validation files were restored
        run: |
          git diff --exit-code -- validation/mutation-v42.json validation/external-validation-v42.json
          git diff --check

      - name: Remove temporary patch machinery
        run: |
          git rm .github/workflows/apply-cli-dispatch-fix.yml
          git rm scripts/apply_cli_hotfix_421.py

      - name: Commit verified hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden CLI dispatch and release 4.2.1"
          git push origin HEAD:fix/cli-dispatch-shadowing-4.2.1
