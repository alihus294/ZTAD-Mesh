name: Probe Drive archive transfer

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-drive-archive.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe unauthenticated download
        shell: bash
        run: |
          set -Eeuo pipefail
          url='https://drive.usercontent.google.com/download?id=1JOWY3CtIw5WAAqlNCZY6Y8uuPXOgsXEK&export=download&confirm=t'
          code="$(curl -L --fail-with-body --silent --show-error --output "$RUNNER_TEMP/archive.bin" --write-out '%{http_code}' "$url" || true)"
          echo "http_code=$code"
          wc -c "$RUNNER_TEMP/archive.bin" || true
          sha256sum "$RUNNER_TEMP/archive.bin" || true
          file "$RUNNER_TEMP/archive.bin" || true
          head -c 200 "$RUNNER_TEMP/archive.bin" | strings || true
