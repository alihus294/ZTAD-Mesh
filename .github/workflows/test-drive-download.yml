name: Inspect existing Git blob transport

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-drive-download.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Measure candidate blob
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/git/blobs/40dfef0bf69b24ae6543594cd9a02cff686190f4" --jq .content \
            | tr -d '\r\n' > "$RUNNER_TEMP/blob-content.txt"
          LENGTH="$(wc -c < "$RUNNER_TEMP/blob-content.txt")"
          HASH="$(sha256sum "$RUNNER_TEMP/blob-content.txt" | awk '{print $1}')"
          echo "::warning title=Existing Git blob transport::length=$LENGTH sha256=$HASH"
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, os
          encoded = (Path(os.environ['RUNNER_TEMP']) / 'blob-content.txt').read_text()
          try:
              raw = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              print(f'::warning title=Existing blob decode::invalid base64: {exc}')
          else:
              print(f'::warning title=Existing blob decode::bytes={len(raw)} sha256={hashlib.sha256(raw).hexdigest()}')
          PY
