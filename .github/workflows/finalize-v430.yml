name: Finalize v4.3 consistency

on:
  push:
    branches:
      - feat/v4.3.0-guarded-fast-path

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: toolkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v4.3.0-guarded-fast-path
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolkit/requirements-dev.lock.txt
      - run: python -m pip install --disable-pip-version-check -r toolkit/requirements-dev.lock.txt
      - name: Apply final consistency fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old[:80]!r}, found {text.count(old)}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace('tests/test_v43_last_gaps.py', 'import ast\nimport json\nimport sqlite3\n', 'import ast\nfrom contextlib import closing\nimport json\nimport sqlite3\n')
          replace('tests/test_v43_last_gaps.py', '    with sqlite3.connect(continuity_db) as conn:\n        assert conn.execute("SELECT COUNT(*) FROM tasks").fetchone()[0] == 1\n', '    with closing(sqlite3.connect(continuity_db)) as conn:\n        assert conn.execute("SELECT COUNT(*) FROM tasks").fetchone()[0] == 1\n')

          test_block = '''      - name: Run unit and integration tests\n        env:\n          PYTHONPATH: toolkit\n        run: python -B -m pytest -q\n'''
          warning_block = test_block + '''\n      - name: Fail on resource leaks in critical v4.3 controls\n        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'\n        env:\n          PYTHONPATH: toolkit\n        run: >-\n          python -B -m pytest -q -W error::ResourceWarning\n          tests/test_v43_last_gaps.py\n          tests/test_v43_final_hardening.py\n          tests/test_v43_runtime_controls.py\n          tests/test_v43_guarded_fast_path.py\n'''
          replace('.github/workflows/ci.yml', test_block, warning_block)

          replace('CHANGELOG.md', '- Added dry-run model-call counts and intended model usage to every mesh plan.\n', '''- Added dry-run model-call counts and intended model usage to every mesh plan.\n- Added controller handling for blocking findings, context expansion, risk escalation, bounded repair/replan, and task-local quarantine.\n- Bound learned routing performance to catalog/provider capability context and required repeated observations before override.\n- Synchronized Continuity phases without auto-granting `MERGE_READY`; exhausted repair budgets now quarantine cleanly.\n- Added a structural CLI shadowing guard and a ResourceWarning-as-error CI gate for critical v4.3 controls.\n- Synchronized architecture, operating guides, model-selection guidance, skills, validation, and traceability documentation with the implemented v4.3 topology.\n''')

          replacements = [
              ('# ZTAD Mesh 4.2.0 — Normative Master Plan', '# ZTAD Mesh 4.3.0 — Normative Master Plan'),
              ('The index is conservative. It does not claim complete runtime understanding. Parallel context scouts inspect independent dimensions.', 'The index is conservative. It does not claim complete runtime understanding. Context scouts are risk-proportional: omitted on the normal R0/R1 path, focused on R2, and parallelized on R3/R4 when independent dimensions justify them.'),
              ('- Economy: navigation, scouting, documentation, qualified mechanical work.\n- Balanced: normal implementation, repair, and test design.\n- Frontier: plan adjudication, sensitive review, high-risk diagnosis, takeover, closure, and release advice.', '- Economy: Luna is the preferred bounded implementation worker for R0/R1 and eligible R2 work.\n- Balanced: Terra is the fallback/focused R2 context and review resource.\n- Frontier: Sol handles required frontier consultation/review, with every Sol invocation hard-capped at HIGH reasoning.'),
              ('ZTAD parallelizes independent work only:', 'ZTAD parallelizes independent work only when the selected risk topology requires it:'),
              ('A risk-adaptive plan contains some or all of:', 'A risk-adaptive plan selects the smallest safe topology: R0/R1 guarded fast path, R2 bounded mesh, and R3/R4 full mesh. Depending on risk it contains some or all of:'),
              ('Economy models handle qualified high-volume work; frontier models are reserved for high-value gates and hard recovery.', 'Luna handles qualified low/medium-risk implementation, Terra provides balanced fallback/focused R2 support, and Sol is reserved for frontier gates and hard recovery with a mandatory HIGH reasoning ceiling.')
          ]
          for old, new in replacements:
              replace('references/MASTER_PLAN.md', old, new)
          PY
      - name: Validate final source
        shell: bash
        run: |
          git diff --check
          python -m compileall -q toolkit tests
          python -B -m pytest -q -W error::ResourceWarning tests/test_v43_last_gaps.py tests/test_v43_final_hardening.py tests/test_v43_runtime_controls.py tests/test_v43_guarded_fast_path.py
          python -B -m pytest -q
          python -B evals/run_evals.py --output "${{ runner.temp }}/eval.json"
          python -B scripts/ztad.py validate-bundle --root .
          python -B scripts/ztad.py policy-wiring --root .
      - name: Commit validated finalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_v43_last_gaps.py .github/workflows/ci.yml CHANGELOG.md references/MASTER_PLAN.md
          git diff --cached --check
          git commit -m "fix: close final v4.3 consistency and resource gaps"
          git push origin HEAD:feat/v4.3.0-guarded-fast-path
