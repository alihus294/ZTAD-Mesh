name: Publish ZTAD Mesh 4.2.0 from trusted archive authority

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v4.2.0-archive-authority.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: ztad-v420-archive-authority
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      ARCHIVE_SHA256: 23bb0357a0900a0c4dfa1110da1d5d08c0f8aa5cae95622e55b06a124a3a272c
      MEMBER_COUNT: "253"
      UNCOMPRESSED_BYTES: "1255479"
      PYTHONDONTWRITEBYTECODE: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Recover archive by cryptographic identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, hashlib, json, os, urllib.error, urllib.request
          from pathlib import Path

          blobs = [
            "40dfef0bf69b24ae6543594cd9a02cff686190f4", "d2a64675f81d57071954f58b60d8d40feba518b3",
            "30d74d258442c7c65512eafab474568dd706c430", "b6fc4c620b67d95f953a5c1c1230aaab5db5a1b0",
            "333d6d1944ca3bbe52f4327d4d59e204482fff3e", "94ac027024b94b42fdaf0274f228de10a45e379c",
            "26ed4a37af607e4c7b2cf3bec727973618add568", "30ea1d1f06056aee677a5ea0b7048bd38de8b70b",
            "825036de6ef5c19af9ca36072786b195f07e040d", "adb49fe40c483855414222615f86fa3ea78f2fe7",
            "39a7a373ba6e9f0498e5cfdf2cd33176d6b4f708", "391bb4929c512c9a16d5ec62ca17a96621101ec4",
            "7c4d9a9d92d09f3929df9194393fa8c5fd9cd5e2", "325e72d43965dbbd2ea577549554473ae11e7661",
            "ca22a4db53b454d4480d38b87f891077722d1ba4", "9319937f238e18db13618cf6c7a8bbe89ce1302d",
            "9a8e96c4c362d10e6962e37f05a5427bba0e9320", "11fc12ea26680864a3a1ddd1913e438492e29105",
            "644ca168f7ef42d8ef00cd6b34acb7a41c4e574f"
          ]
          expected = os.environ["ARCHIVE_SHA256"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          out = Path(os.environ["RUNNER_TEMP"]) / "source.tar.xz"
          chosen = None
          for sha in blobs:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/git/blobs/{sha}",
                  headers={"Accept":"application/vnd.github+json","Authorization":f"Bearer {token}","X-GitHub-Api-Version":"2022-11-28","User-Agent":"ztad-publisher"}
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      obj = json.load(response)
              except urllib.error.HTTPError:
                  continue
              data = base64.b64decode(obj.get("content", ""), validate=False)
              if hashlib.sha256(data).hexdigest() == expected:
                  out.write_bytes(data)
                  chosen = sha
                  break
          if chosen is None:
              raise SystemExit("no repository Git blob matches the trusted archive SHA-256")
          print(json.dumps({"archive_sha256": expected, "git_blob": chosen, "bytes": out.stat().st_size}, indent=2))
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"ARCHIVE_PATH={out}\nSOURCE_GIT_BLOB={chosen}\n")
          PY
          echo "${ARCHIVE_SHA256}  ${ARCHIVE_PATH}" | sha256sum --check --strict

      - name: Safely extract exact archive members
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, stat, tarfile
          from pathlib import Path, PurePosixPath

          archive = Path(os.environ["ARCHIVE_PATH"])
          root = Path(os.environ["RUNNER_TEMP"]) / "source"
          root.mkdir(parents=True, exist_ok=False)
          expected_count = int(os.environ["MEMBER_COUNT"])
          expected_bytes = int(os.environ["UNCOMPRESSED_BYTES"])
          seen = set(); total = 0
          with tarfile.open(archive, "r:xz") as tf:
              members = tf.getmembers()
              if len(members) != expected_count:
                  raise SystemExit(f"member count mismatch: {len(members)}")
              for member in members:
                  name = member.name[2:] if member.name.startswith("./") else member.name
                  path = PurePosixPath(name)
                  if not name or path.is_absolute() or "." in path.parts or ".." in path.parts:
                      raise SystemExit(f"unsafe member path: {member.name}")
                  folded = path.as_posix().casefold()
                  if folded in seen:
                      raise SystemExit(f"path collision: {name}")
                  seen.add(folded)
                  if not member.isfile() or member.issym() or member.islnk() or member.isdev() or member.isfifo():
                      raise SystemExit(f"unsupported member: {member.name}")
                  total += member.size
                  if total > expected_bytes:
                      raise SystemExit("archive exceeds trusted size")
                  target = (root / Path(*path.parts)).resolve()
                  if os.path.commonpath([str(root.resolve()), str(target)]) != str(root.resolve()):
                      raise SystemExit(f"archive escape: {member.name}")
                  stream = tf.extractfile(member)
                  if stream is None:
                      raise SystemExit(f"cannot extract: {member.name}")
                  data = stream.read()
                  if len(data) != member.size:
                      raise SystemExit(f"short read: {member.name}")
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(0o755 if member.mode & stat.S_IXUSR else 0o644)
          if total != expected_bytes:
              raise SystemExit(f"byte count mismatch: {total}")
          required = ["VERSION","README.md",".codex-plugin/plugin.json","scripts/ztad.py","toolkit/ztad/mesh_runtime.py","tests","skills","policies","schemas","hooks"]
          missing = [p for p in required if not (root / p).exists()]
          if missing:
              raise SystemExit(f"required paths missing: {missing}")
          if (root / "VERSION").read_text(encoding="utf-8").strip() != "4.2.0":
              raise SystemExit("VERSION mismatch")
          print(f"validated {len(members)} files and {total} bytes")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"SOURCE_ROOT={root}\n")
          PY

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input 'PyYAML==6.0.3' 'jsonschema==4.26.0' 'cryptography>=48.0.1,<51'

      - name: Run all local product gates
        shell: bash
        working-directory: ${{ env.SOURCE_ROOT }}
        run: |
          set -euo pipefail
          python -B -m unittest discover -s tests -p 'test*.py' -v
          python -B scripts/ztad.py validate-bundle --root .
          python -B scripts/ztad.py policy-wiring --root .
          find . -type d -name __pycache__ -prune -exec rm -rf -- {} +
          find . -type f \( -name '*.pyc' -o -name '.coverage*' \) -delete

      - name: Publish archive contents exactly
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "${SOURCE_ROOT}/." .
          test ! -e .bootstrap
          git add -f -A
          git diff --cached --check
          tree="$(git write-tree)"
          file_count="$(git ls-files | wc -l | tr -d ' ')"
          echo "Published Git tree candidate: ${tree} (${file_count} files)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: publish ZTAD Mesh 4.2.0 from trusted archive"
          git push origin HEAD:main
          echo "PUBLISHED_TREE=${tree}" >> "$GITHUB_ENV"
          echo "PUBLISHED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PUBLISHED_FILE_COUNT=${file_count}" >> "$GITHUB_ENV"

      - name: Create version tag and release record
        shell: bash
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          if git ls-remote --exit-code --tags origin refs/tags/v4.2.0 >/dev/null 2>&1; then
            git fetch --force origin refs/tags/v4.2.0:refs/tags/v4.2.0
            tag_tree="$(git rev-parse 'v4.2.0^{tree}')"
            test "${tag_tree}" = "${PUBLISHED_TREE}"
          else
            git tag -a v4.2.0 -m "ZTAD Mesh 4.2.0" "${current}"
            git push origin refs/tags/v4.2.0
          fi
          notes="Trusted archive SHA-256: ${ARCHIVE_SHA256}
Source Git blob: ${SOURCE_GIT_BLOB}
Published Git tree: ${PUBLISHED_TREE}
Published file count: ${PUBLISHED_FILE_COUNT}

The complete unit/integration suite, bundle validation, and policy-wiring validation passed before publication. Target-host acceptance remains mandatory before governed merge or production authority."
          if gh release view v4.2.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit v4.2.0 --repo "${GITHUB_REPOSITORY}" --title "ZTAD Mesh 4.2.0" --notes "${notes}"
          else
            gh release create v4.2.0 --repo "${GITHUB_REPOSITORY}" --title "ZTAD Mesh 4.2.0" --verify-tag --notes "${notes}"
          fi

      - name: Close transport issue and clean temporary branches
        shell: bash
        run: |
          set -euo pipefail
          if gh issue view 1 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh issue close 1 --repo "${GITHUB_REPOSITORY}" --reason completed --comment "Publication completed from trusted archive ${ARCHIVE_SHA256}. Git tree: ${PUBLISHED_TREE}; release: v4.2.0."
          fi
          git push origin --delete bootstrap/v4.2.0-local-source >/dev/null 2>&1 || true
          git push origin --delete verify/v4.2.0-publication >/dev/null 2>&1 || true
