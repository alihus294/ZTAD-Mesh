name: v4.3.8 traceability sync

on:
  push:
    branches:
      - fix/workshopos-skill-wiring-v4.3.8

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out candidate branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/workshopos-skill-wiring-v4.3.8
          fetch-depth: 0

      - name: Normalize explanatory wording and current markers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace_once(
              "references/MASTER_PLAN.md",
              "A model or supervisor proposal remains advisory. The protected non-model controller may emit E6 only after it independently verifies:",
              "A model or supervisor proposal remains advisory. The protected non-model controller can emit E6 only after it independently verifies:",
          )
          replace_once(
              "references/MASTER_PLAN.md",
              "The controller MUST NOT create E6 by merely signing, wrapping, or translating a model `APPROVE` recommendation. Production release authorization MUST represent an authorized protected production action outside model self-approval.",
              "The controller is prohibited from creating E6 by merely signing, wrapping, or translating a model `APPROVE` recommendation. Production release authorization represents an authorized protected production action outside model self-approval.",
          )
          replace_once(
              ".github/ISSUE_TEMPLATE/bug_report.yml",
              "placeholder: 4.3.7",
              "placeholder: 4.3.8",
          )
          replace_once(
              "traceability/BUG_TO_PRODUCTION_MAPPING.md",
              "# WorkshopOS Bug-to-Production Protocol Mapping — ZTAD Mesh 4.3.7",
              "# WorkshopOS Bug-to-Production Protocol Mapping — ZTAD Mesh 4.3.8",
          )
          PY

      - name: Regenerate normative traceability
        run: python -B scripts/generate_traceability.py

      - name: Verify generated identity and diff hygiene
        run: |
          python -B scripts/verify_version_identity.py --profile source
          git diff --check
          test "$(python - <<'PY'
          import csv
          with open('traceability/requirements.csv', encoding='utf-8', newline='') as f:
              print(sum(1 for _ in csv.DictReader(f)))
          PY
          )" = "134"

      - name: Commit generated sync and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v438-traceability-sync.yml
          git add references/MASTER_PLAN.md traceability/requirements.csv traceability/TRACEABILITY_MATRIX.md traceability/BUG_TO_PRODUCTION_MAPPING.md .github/ISSUE_TEMPLATE/bug_report.yml
          git diff --cached --check
          git commit -m "chore: regenerate v4.3.8 normative traceability"
          git push origin HEAD:fix/workshopos-skill-wiring-v4.3.8
