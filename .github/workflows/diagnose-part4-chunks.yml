name: Diagnose all part 4 transport chunks

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-part4-chunks.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify stored chunks and expose bad block hashes
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess

          repo = os.environ['GITHUB_REPOSITORY']
          specs = {
              (0, 0): (5239859933, 'd589859e41fa4be1ef2129297c8987c0f0b89bdb16e9e59762dc8f74364adcdd'),
              (0, 1): (5239873243, '4624f43b8888e75241b4a938e1a4db2303bfa6b30b767206cc7dc624f12c1cad'),
              (0, 2): (5239887194, '996231719d3575943247e842aea40c3cc87c81e85d4ed9909e859f56fd57ae47'),
              (0, 3): (5239923685, 'b2b84c3531aa9d4bd2ad5e6a5ff30c37df6a557e5e0118b806e3ecfaa165b4d0'),
              (1, 0): (5239940591, 'e5612fbb55b5b85eef6f1a398b111f54ee7ba815df604e023054f62aa179477f'),
              (1, 1): (5239963839, '31645d89e073d8861e80114c61ccf97379ff57364a882b733fb4d26ac0fbe913'),
              (1, 2): (5239986267, '588050053c6ec3e5500562d418c51b8c57d0dd26f47b87c434e94bde1d5363ec'),
              (1, 3): (5240009368, '48b75d87dfc8948ab18e8c022686f55575d26b0c4e78df7a311304da430a98c7'),
              (2, 0): (5240031707, '2c0252b9ff6edf846b9972050e653afcb719735a2d31f02883adabd28237264b'),
              (2, 1): (5240053799, 'c6423f57b24a5e01d79b31580312b09ab01d0e013962850b294cac3a3ef81e45'),
              (2, 2): (5240079858, '84dcc69e305f59ed0960f417a2bfcf0f2273dec39e9a12b506dc2e867f6f9c04'),
              (2, 3): (5240102782, '6a642902c65c34b529e18111f7c6d8808dd1e750eff30934666c31975d4f9bf2'),
              (3, 0): (5240124217, 'bdede308357a5b06d28fc9a3da3f1da85900e0b714da1cfdd0274956a454b6d6'),
          }
          header_re = re.compile(r'ZTAD_SOURCE_PART4_SEGMENT_CHUNK ([0-3]) ([0-3]) 4000 ([0-9a-f]{64})')
          bad = []
          for key, (comment_id, expected_hash) in specs.items():
              result = subprocess.run(
                  ['gh', 'api', f'repos/{repo}/issues/comments/{comment_id}'],
                  check=True, capture_output=True, text=True,
              )
              item = json.loads(result.stdout)
              header, separator, raw = item['body'].partition('\n')
              match = header_re.fullmatch(header.strip()) if separator else None
              payload = ''.join(raw.split()) if separator else ''
              digest = hashlib.sha256(payload.encode('ascii')).hexdigest()
              header_ok = bool(match and (int(match.group(1)), int(match.group(2))) == key and match.group(3) == expected_hash)
              ok = header_ok and len(payload) == 4000 and digest == expected_hash
              print(f'chunk={key[0]}-{key[1]} comment={comment_id} header_ok={str(header_ok).lower()} length={len(payload)} sha256={digest} expected={expected_hash} ok={str(ok).lower()}')
              if not ok:
                  bad.append(key)
                  for block in range(40):
                      data = payload[block*100:(block+1)*100]
                      print(f'bad={key[0]}-{key[1]} block={block} length={len(data)} sha256={hashlib.sha256(data.encode("ascii")).hexdigest()}')
          print(f'bad_chunks={bad}')
          PY
