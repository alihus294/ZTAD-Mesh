name: Apply v4.3 runtime controls

on:
  push:
    branches:
      - feat/v4.3.0-guarded-fast-path

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: toolkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/v4.3.0-guarded-fast-path
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: toolkit/requirements-dev.lock.txt
      - run: python -m pip install --disable-pip-version-check -r toolkit/requirements-dev.lock.txt
      - name: Apply runtime controls
        run: python validation/apply_v430_runtime_controls.py
      - name: Compile and diff checks
        run: |
          python -m compileall -q toolkit tests
          git diff --check
      - name: Run runtime-control regressions
        run: python -B -m pytest -q tests/test_v43_runtime_controls.py tests/test_v43_guarded_fast_path.py
      - name: Run full unit and integration suite
        run: python -B -m pytest -q
      - name: Run offline evals
        run: python -B evals/run_evals.py --output "${{ runner.temp }}/eval-summary.json"
      - name: Validate bundle and policy wiring
        run: |
          python -B scripts/ztad.py validate-bundle --root .
          python -B scripts/ztad.py policy-wiring --root .
      - name: Commit validated runtime controls
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!.github/workflows/apply-v430-runtime-controls.yml' ':!validation/apply_v430_runtime_controls.py'
          git diff --cached --check
          git commit -m "feat: bind runtime decisions to deterministic evidence"
          git push origin HEAD:feat/v4.3.0-guarded-fast-path
