name: Diagnose ZTAD segmented transport

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-transport-v2.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch comments
        shell: bash
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/2/comments?per_page=100" > "$RUNNER_TEMP/comments.json"

      - name: Emit segmented transport inventory
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re

          comments = json.loads((Path(os.environ["RUNNER_TEMP"]) / "comments.json").read_text())
          selected = re.compile(r"(?:ZTAD_SOURCE_PART5_SEGMENT [0-3]|ZTAD_SOURCE_PART0_SEGMENT [56]) ")
          found = 0
          for item in comments:
              if (item.get("user") or {}).get("login") != "alihus294":
                  continue
              body = item.get("body")
              if not isinstance(body, str):
                  continue
              header, separator, raw = body.partition("\n")
              if not separator or not selected.match(header):
                  continue
              payload = "".join(raw.split())
              digest = hashlib.sha256(payload.encode("ascii")).hexdigest()
              print(f"::warning title=ZTAD segmented item::{header} | actual_length={len(payload)} | actual_sha256={digest}")
              found += 1
          print(f"::notice title=ZTAD segmented count::{found} selected transport comments inspected")
          PY
