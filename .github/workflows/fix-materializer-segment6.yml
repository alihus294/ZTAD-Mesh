name: Fix materializer segment 6 checksum

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-materializer-segment6.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ztad-fix-materializer-segment6
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Correct checksum and remove temporary fixer
        shell: bash
        run: |
          set -Eeuo pipefail
          FILE=.github/workflows/materialize-verified.yml
          OLD=56151e6dfb8d852279f7c143f840de148df25bfeab90a0b366391f0f0d11352d
          NEW=a0b262dbe64ceaca26fd17f10a34a884a8fd586bc15c1837d319bb446359e8fd
          test "$(grep -o "$OLD" "$FILE" | wc -l)" -eq 1
          sed -i "s/$OLD/$NEW/" "$FILE"
          rm -- .github/workflows/fix-materializer-segment6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "ci: correct part 0 segment 6 checksum"
          git push origin HEAD:main
