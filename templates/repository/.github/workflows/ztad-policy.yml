name: ZTAD Policy Gate

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ztad-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned policy dependencies
        run: python -m pip install --disable-pip-version-check --no-input -r .delivery/ztad/requirements.lock.txt
      - name: Resolve comparison SHAs
        shell: python
        run: |
          import os
          from pathlib import Path
          event = os.environ.get("GITHUB_EVENT_NAME")
          if event == "pull_request":
              base = "${{ github.event.pull_request.base.sha }}"
              head = "${{ github.event.pull_request.head.sha }}"
          else:
              base = "${{ github.event.merge_group.base_sha }}"
              head = "${{ github.event.merge_group.head_sha }}"
          Path(os.environ["GITHUB_ENV"]).write_text(f"ZTAD_BASE={base}\nZTAD_HEAD={head}\n", encoding="utf-8")
      - name: Validate governed change
        run: >-
          python .delivery/ztad/bin/ztad.py preflight
          --repo .
          --contract .delivery/change-contract.yaml
          --base "$ZTAD_BASE"
          --head "$ZTAD_HEAD"
